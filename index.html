      '<div class="leg"><div><i style="background:'+C.gray+'"></i><span>Prélèvements</span></div>'+S.categories.map(k=>'<div><i style="background:'+k.color+'"></i><span>'+esc(k.name)+'</span></div>').join('')+'</div></div></section>';
    const rates=last.map(x=>{const ss=stats(x),inc=ss.income;return {label:dShort(x.start),v:inc>0?(ss.savedNet+ss.bonusSaved)/inc*100:0};});
    h+='<section class="sec"><div class="sec-h"><h2>Taux d\'épargne</h2></div><div class="panel pad">'+rateSvg(rates,c.rate||20)+'<p class="help">Part de tes revenus mise de côté à chaque cycle. En vert : objectif atteint.</p></div></section>';
  }

  const hp=habitsProfile();
  h+='<section class="sec"><div class="sec-h"><h2>Ce que j\'ai compris de toi</h2></div><div class="list">'+
    (hp.items.length?hp.items.map(i=>'<div class="row nobadge" style="align-items:flex-start"><span style="font-size:22px;line-height:1.2">'+i.icon+'</span><div class="grow"><div class="t" style="white-space:normal;font-weight:500">'+esc(i.t)+'</div></div></div>').join(''):'<div class="row nobadge"><div class="grow muted" style="white-space:normal">Enregistre encore '+hp.need+' dépense'+(hp.need>1?'s':'')+' pour que je comprenne tes habitudes : jours, rythme, catégories qui dépassent.</div></div>')+
    '</div><p class="help">Calculé uniquement sur ton téléphone, à partir de tes opérations. Plus tu l\'utilises, plus c\'est précis.</p></section>';
  h+='<section class="sec"><div class="sec-h"><h2>Ton cycle jour par jour</h2></div><div class="panel pad">'+friseSvg(c,st)+'<div style="height:12px"></div>'+heatmapHtml(c,st)+'</div></section>';

  if(S.goals.length)h+='<section class="sec"><div class="sec-h"><h2>Objectifs</h2><button class="link" data-act="tab" data-id="save">Voir</button></div><div class="ringgrid">'+S.goals.map(g=>{const gp=goalProgress(g);return '<div class="tile"><div class="ring">'+ringSvg(gp.pct,g.color,false,68,7)+'<span class="em">'+esc(g.icon)+'</span></div><b>'+esc(g.name)+'</b><span class="s">'+Math.round(gp.pct*100)+' %</span><span class="s2">sur '+eurR(g.target)+'</span></div>';}).join('')+'</div></section>';

  const inv=investAccounts();
  if(inv.length){
    const invested=sum(inv,l=>investedAt(l,S.today)),value=sum(inv,l=>livretValue(l)),gain=value-invested;
    h+='<section class="sec"><div class="sec-h"><h2>Bourse</h2><button class="link" data-act="gotoFolio">Détails</button></div><div class="panel pad"><div class="two"><div><div class="small muted">Valeur</div><div style="font:700 26px var(--font);letter-spacing:-.02em" class="num">'+eurR(value)+'</div></div><div><div class="small muted">Plus-value</div><div style="font:700 26px var(--font);letter-spacing:-.02em;color:'+(gain>=0?'var(--pos)':'var(--neg)')+'" class="num">'+(gain>=0?'+':'−')+eurR(Math.abs(gain))+'</div></div></div></div></section>';
  }
  return h;
}

/* =====================================================================
   SAISIE INTELLIGENTE : « 45 essence », « courses 62,30 hier »…
   Compréhension 100 % locale (aucune donnée n'est envoyée) : mots-clés,
   noms de tes catégories et apprentissage sur tes propres opérations.
   ===================================================================== */
const QSTOP=new Set(['de','du','des','la','le','les','un','une','au','aux','chez','pour','par','en','et','a','sur','mon','ma','mes','ce','cet','cette','euro','euros','eur','hier','avant','aujourd','hui','matin','soir']);
const DAYS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const SYN=[
  [/essence|carbur|gasoil|diesel|auto|voiture/,/essence|carburant|gasoil|diesel|plein|station|total|esso|shell|avia|\bbp\b/],
  [/course|aliment|supermarch|nourriture|manger/,/course|supermarche|leclerc|carrefour|lidl|aldi|auchan|intermarche|super u|franprix|monoprix|casino|picard|biocoop|drive|boulangerie|marche/],
  [/fun|sortie|loisir|resto|plaisir|restaurant|distraction/,/restaurant|resto|mcdo|mc do|burger|kebab|pizza|cinema|netflix|spotify|soiree|bar\b|cafe|verre|biere|jeu|steam|concert|sortie/]
];
function qTokens(s){return nrm(s).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!QSTOP.has(w)&&!/^\d+$/.test(w));}

function historyWords(){
  const m={};
  S.operations.forEach(o=>{
    if(o.type!=='depense'||!o.catId)return;
    qTokens(o.label).forEach(w=>{(m[w]=m[w]||{})[o.catId]=((m[w]||{})[o.catId]||0)+1;});
  });
  return m;
}
function parseQuick(text){
  const raw=String(text||'').trim();
  if(!raw)return null;
  let work=' '+raw.toLowerCase().replace(/\u20ac/g,' € ')+' ';
  const n=nrm(work);
  /* date */
  let date=S.today,dateTxt='aujourd\'hui';
  const dm=/(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?/.exec(n);
  if(dm){
    let y=dm[3]?+dm[3]:+S.today.slice(0,4);if(y<100)y+=2000;
    const iso=y+'-'+String(+dm[2]).padStart(2,'0')+'-'+String(+dm[1]).padStart(2,'0');
    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)&&!isNaN(D.p(iso))&&+dm[2]>=1&&+dm[2]<=12&&+dm[1]>=1&&+dm[1]<=31){
      date=iso;if(!dm[3]&&date>S.today)date=(y-1)+iso.slice(4);
      dateTxt=dShort(date);
    }
    work=work.replace(/\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?/,' ');
  }else if(/avant[ -]?hier/.test(n)){date=D.add(S.today,-2);dateTxt='avant-hier';work=work.replace(/avant[ -]?hier/,' ');}
  else if(/\bhier\b/.test(n)){date=D.add(S.today,-1);dateTxt='hier';work=work.replace(/\bhier\b/,' ');}
  else{
    const di=DAYS.findIndex(d=>new RegExp('\\b'+d+'\\b').test(n));
    if(di>=0){
      const dow=new Date(D.p(S.today)).getUTCDay(),back=(dow-di+7)%7;
      date=D.add(S.today,-back);dateTxt=back===0?'aujourd\'hui':DAYS[di];
      work=work.replace(new RegExp(DAYS[di],'i'),' ');
    }
  }
  /* montant */
  let am=NaN,m=/(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur(?:os?)?\b)/.exec(work.replace(/\s+/g,' '));
  if(m){am=parseFloat(m[1].replace(',','.'));work=work.replace(m[0],' ');}
  else{
    m=/(\d+(?:[.,]\d{1,2})?)/.exec(work);
    if(m){am=parseFloat(m[1].replace(',','.'));work=work.replace(m[0],' ');}
  }
  work=work.replace(/€/g,' ').replace(/\s+/g,' ').trim();
  const nn=nrm(work);
  /* type */
  let type='depense';
  if(/recu|cadeau|anniversaire|remboursement|rentree|prime|gagne|touche|heritage|argent de poche/.test(nn))type='revenu';
  else if(/epargn|mis de cote|mets de cote|virement vers|livret/.test(nn))type='epargne';
  /* catégorie */
  let catId='';
  if(type==='depense'){
    const toks=qTokens(work);
    const direct=S.categories.find(k=>{const kn=nrm(k.name);return kn.length>=3&&new RegExp('(^|[^a-z])'+kn.replace(/[^a-z0-9 ]/g,'')+'([^a-z]|$)').test(nn);});
    if(direct)catId=direct.id;
    if(!catId){
      let rules={};try{rules=JSON.parse(S.settings.catRules||'{}');}catch(e){}
      const key=labelKey(work);if(key&&rules[key]&&catById(rules[key]))catId=rules[key];
    }
    if(!catId){
      const hw=historyWords(),score={};
      toks.forEach(w=>{const e=hw[w];if(e)Object.keys(e).forEach(id=>{score[id]=(score[id]||0)+e[id];});});
      const best=Object.keys(score).filter(id=>catById(id)).sort((a,b)=>score[b]-score[a])[0];
      if(best)catId=best;
    }
    if(!catId){
      for(const sy of SYN){
        if(sy[1].test(nn)){const k=S.categories.find(c=>sy[0].test(nrm(c.name)));if(k){catId=k.id;break;}}
      }
    }
  }
  let livretId='';
  if(type==='epargne'){
    const byName=S.livrets.filter(canReceive).find(l=>nn.indexOf(nrm(l.name))>=0);
    const l=byName||S.livrets.find(canReceive)||S.livrets.find(x=>x.active);
    if(l)livretId=l.id;
  }
  let label=work.replace(/\b(j'ai|jai|j ai|pris|payé|paye|dépensé|depense|acheté|achete|reçu|recu|de l'|d'|euros?)\b/gi,' ').replace(/\s+/g,' ').trim();
  if(label.length>1)label=label.charAt(0).toUpperCase()+label.slice(1);else label='';
  return {type,amount:isFinite(am)&&am>0?r2(am):NaN,date,dateTxt,catId,livretId,label};
}
function quickPreviewHtml(p){
  if(!p)return '';
  if(!isFinite(p.amount))return '<span class="muted">Ajoute un montant, par exemple « 45 essence ».</span>';
  if(p.type==='revenu')return '<span>🎁 Rentrée de <b>'+eur(p.amount)+'</b>'+(p.label?' · '+esc(p.label):'')+'</span><button class="btn sm go" data-act="quickGo">Continuer</button>';
  if(p.type==='epargne'){const l=livretById(p.livretId);return '<span>🌱 Épargne de <b>'+eur(p.amount)+'</b>'+(l?' vers '+esc(l.name):'')+'</span><button class="btn sm go" data-act="quickGo">Continuer</button>';}
  const k=p.catId?catById(p.catId):null;
  return k?'<span>'+esc(k.icon)+' <b>'+esc(k.name)+'</b> · '+eur(p.amount)+' · '+esc(p.dateTxt)+(p.label&&nrm(p.label)!==nrm(k.name)?' · '+esc(p.label):'')+'</span><button class="btn sm go" data-act="quickGo">Ajouter</button>'
    :'<span>'+eur(p.amount)+' · '+esc(p.dateTxt)+' · <span class="muted">touche la catégorie</span></span><button class="btn sm go" data-act="quickGo">Continuer</button>';
}
function updateQuickPreview(){
  const f=$('#f_quick'),o=$('#qprev');if(!f||!o)return;
  const p=parseQuick(f.value);
  UI.quickParsed=p;
  o.innerHTML=quickPreviewHtml(p);o.hidden=!p;
}
async function applyQuick(){
  const f=$('#f_quick');if(!f)return;
  const p=UI.quickParsed||parseQuick(f.value);
  if(!p||!isFinite(p.amount)){toast('Ajoute un montant, par exemple « 45 essence ».',true);return;}
  if(p.type==='depense'&&p.catId){
    await saveOp({type:'depense',catId:p.catId,amount:String(p.amount),label:p.label,date:p.date});
    return;
  }
  readAdd();
  opDraft.amount=fnum(p.amount);opDraft.date=p.date;if(p.label)opDraft.label=p.label;
  if(p.type==='revenu'){opDraft.type='revenu';}
  else if(p.type==='epargne'){opDraft.type='epargne';if(p.livretId)opDraft.livretId=p.livretId;}
  drawAdd(false);
  if(p.type==='depense')toast('Touche la catégorie pour enregistrer.');
}
function quickBlockHtml(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  return '<div class="quick"><input id="f_quick" data-act="quickText" placeholder="Ou écris : « 45 essence », « courses 62,30 hier »" autocomplete="off" aria-label="Saisie en une phrase">'+(SR?'<button class="mic" data-act="quickMic" aria-label="Dicter">🎤</button>':'')+'</div><div class="qprev" id="qprev" hidden></div>';
}
Object.assign(ACT,{
  quickGo(){applyQuick();},
  quickMic(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('La dictée n\'est pas disponible sur cet appareil.',true);return;}
    try{
      const rec=new SR();rec.lang='fr-FR';rec.interimResults=false;rec.maxAlternatives=1;
      rec.onresult=e=>{const t=e.results[0][0].transcript;const f=$('#f_quick');if(f){f.value=t;updateQuickPreview();}};
      rec.onerror=()=>toast('Dictée impossible pour le moment.',true);
      toast('Je t\'écoute… dis par exemple « 45 euros d\'essence ».');
      rec.start();
    }catch(e){toast('Dictée impossible pour le moment.',true);}
  }
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='f_quick')updateQuickPreview();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='f_quick'){e.preventDefault();applyQuick();}});

/* =====================================================================
   ASSISTANT INTELLIGENT
   Réponses 100 % locales : l'appli répond à tes questions avec TES chiffres,
   sans rien envoyer sur internet et sans aucun abonnement.
   ===================================================================== */
/* ---------- réponses locales ---------- */
const fmtD=n=>(Math.round(n*10)/10).toString().replace('.',',');
function localAnswer(q){
  const c=currentCycle();
  if(!c)return {t:'Démarre d\'abord un cycle avec « J\'ai été payé » : je pourrai alors répondre à tes questions.',act:['J\'ai été payé','newCycle']};
  const st=stats(c),n=nrm(q);
  const hasWord=re=>re.test(n);
  const p=parseQuick(q);
  const k=p&&p.catId?catById(p.catId):null;
  const row=k?st.rows.find(r=>r.cat.id===k.id):null;
  /* puis-je me permettre… ? */
  if(hasWord(/(puis[- ]?je|peux[- ]?je|ai[- ]?je les moyens|je peux|c'est possible|me permettre|acheter|depenser).*\d/)&&p&&isFinite(p.amount)){
    const a=p.amount,after=st.available-a;
    let t='';
    if(row&&row.remaining-a<0&&after>=0){
      const best=st.rows.filter(r=>r.cat.id&&r.cat.id!==k.id&&r.remaining>0).sort((x,y)=>y.remaining-x.remaining)[0];
      t='Ça dépasserait l\'enveloppe **'+k.name+'** de '+eurR(a-row.remaining)+', mais ton disponible global le permet : il te resterait '+eurR(after)+' ('+eurR(Math.max(0,after/st.daysLeft))+' par jour).'+(best?' Tu peux compenser avec **'+best.cat.name+'** ('+eurR(best.remaining)+' de marge).':'');
    }else if(after<0)t='Non, ça ferait dépasser ton disponible de '+eurR(-after)+'. Il te reste '+eurR(Math.max(0,st.available))+' jusqu\'à ta prochaine paie.';
    else t='Oui, tu peux. Après '+eurR(a)+', il te resterait **'+eurR(after)+'** sur tes enveloppes, soit environ '+eurR(Math.max(0,after/st.daysLeft))+' par jour pendant '+st.daysLeft+' jours.'+(row?' L\'enveloppe '+k.name+' passerait à '+eurR(row.remaining-a)+'.':'');
    return {t};
  }
  if(hasWord(/bilan|economie|que faire de|argent restant|reste.*placer|utiliser.*argent/))return {t:'Je prépare ta proposition pour utiliser ce que tu n\'auras pas dépensé.',act:['Voir le bilan','bilan']};
  if(hasWord(/habitude|compris|connais|profil de depense|comment je depense|ma facon de|ma maniere de|mes tendances/)){
    const hp=habitsProfile();
    return {t:hp.items.length?'Voici ce que j\'ai compris de tes habitudes :\n'+hp.items.map(i=>i.icon+' '+i.t).join('\n'):'Il me faut encore '+hp.need+' dépense'+(hp.need>1?'s':'')+' enregistrée'+(hp.need>1?'s':'')+' pour comprendre tes habitudes.'};
  }
  if(hasWord(/aide|comment (ca|ça) marche|comment utiliser|tuto|visite/))return {t:'Voici la visite guidée en quelques écrans.',act:['Ouvrir la visite','tour']};
  if(hasWord(/plafond|marge|place restante|peux.*encore.*mettre/)){
    const l=S.livrets.filter(x=>x.active&&x.ceiling>0);
    if(!l.length)return {t:'Tu n\'as pas de livret avec un plafond renseigné.'};
    return {t:'Marge restante sur tes livrets :\n'+l.map(x=>'• **'+x.name+'** : '+(livretRoom(x)<1?'plein':eurR(livretRoom(x))+' (plafond '+eurR(x.ceiling)+')')+(x.paused?' · en pause':'')).join('\n')};
  }
  if(hasWord(/prochaine paie|quand.*(paie|paye|salaire)|combien de jours/)){
    const end=D.add(c.start,st.total);
    return {t:'Ta prochaine paie est attendue vers le **'+dLong(end)+'**, dans environ '+st.daysLeft+' jour'+(st.daysLeft>1?'s':'')+'. Si elle arrive à une autre date, touche « J\'ai été payé » le jour venu.'};
  }
  if(hasWord(/fin (de|du) cycle|a ce rythme|prevision|finis|finir|finirai|finissons|projection|a la fin du mois/)){
    const proj=st.avgDaily*st.total;
    return {t:'À ton rythme actuel ('+eurR(st.avgDaily)+' par jour), tu finirais le cycle autour de **'+eurR(proj)+'** de dépenses sur '+eurR(st.envBudget)+' prévus : '+(proj>st.envBudget*1.05?'tu dépasserais d\'environ '+eurR(proj-st.envBudget)+'.':(proj<st.envBudget*0.9?'il resterait environ '+eurR(st.envBudget-proj)+' non dépensés.':'tu es dans les clous.'))};
  }
  if(hasWord(/(plus gros|plus grosse|plus cher|top|maximum).*(depense|achat)|depense.*(plus gros|plus cher)/)){
    const top=st.ops.filter(o=>o.type==='depense').sort((a,b)=>b.amount-a.amount).slice(0,3);
    return {t:top.length?'Tes plus grosses dépenses ce cycle :\n'+top.map(o=>'• '+dShort(o.date)+' · '+o.label+' : **'+eur(o.amount)+'**').join('\n'):'Aucune dépense enregistrée ce cycle.'};
  }
  if(hasWord(/compar|mois dernier|cycle precedent|par rapport/)){
    const cs=cyclesSorted(),prev=cs.length>1?cs[cs.length-2]:null;
    if(!prev)return {t:'Il te faut au moins deux cycles pour comparer.'};
    const sp=stats(prev),day=st.since;
    const prevSame=sum(sp.ops.filter(o=>o.type==='depense'&&D.diff(prev.start,o.date)<=day),o=>o.amount);
    return {t:'Au même stade du cycle, tu avais dépensé **'+eurR(prevSame)+'** le cycle précédent, contre **'+eurR(st.envSpent)+'** aujourd\'hui ('+(st.envSpent>prevSame?'+':'−')+eurR(Math.abs(st.envSpent-prevSame))+'). Cycle précédent complet : '+eurR(sp.envSpent)+' dépensés, '+eurR(sp.savedNet)+' épargnés.'};
  }
  if(k&&hasWord(/combien|depense|reste|budget|ou en (suis|est|sont)|ou j'en suis|en est|etat|situation/)){
    const prev=cyclesSorted().slice(-2,-1)[0],ps=prev?stats(prev).rows.find(r=>r.cat.id===k.id):null;
    return {t:k.icon+' **'+k.name+'** : '+eur(row.spent)+' dépensés sur '+eur(row.budget)+' prévus, il reste **'+eur(Math.max(0,row.remaining))+'**'+(row.remaining>0&&!st.closed?' (≈ '+eurR(row.remaining/st.daysLeft)+' par jour)':'')+'.'+(row.remaining<0?' Tu as dépassé de '+eur(-row.remaining)+'.':'')+(ps?'\nCycle précédent : '+eurR(ps.spent)+'.':'')};
  }
  if(hasWord(/epargn|livret|patrimoine|combien.*(de cote|cote)|mis de cote|pea|assurance/)){
    const act=S.livrets.filter(l=>l.active),tot=sum(act,l=>livretValue(l));
    return {t:'Tu as **'+eur(tot)+'** de côté au total :\n'+act.map(l=>'• '+l.name+' : '+eur(livretValue(l))+(l.paused?' (en pause)':'')).join('\n')+'\nCe cycle : '+eur(st.savedNet)+' épargnés sur '+eur(st.savings)+' prévus.'};
  }
  if(hasWord(/objectif|but |projet|voyage|permis/)&&S.goals.length){
    return {t:S.goals.map(g=>{const gp=goalProgress(g);return '• '+g.icon+' **'+g.name+'** : '+eurR(gp.cur)+' sur '+eurR(g.target)+' ('+Math.round(gp.pct*100)+' %)'+(gp.perCycle?' · ≈ '+eurR(gp.perCycle)+' par cycle':'');}).join('\n')};
  }
  if(hasWord(/taux d'?epargne|combien.*epargner|epargne.*prevue/))
    return {t:'Ton taux d\'épargne ce cycle est de **'+fmtD(c.rate)+' %**, soit '+eur(st.savings)+' prévus ('+eur(st.savedNet)+' déjà épargnés).'};
  if(hasWord(/revenu|salaire|paie|gagne|apl|aide/)&&!hasWord(/prochaine|quand/))
    return {t:'Revenus de ce cycle : **'+eur(st.income)+'**'+((c.incomes||[]).length?' ('+c.incomes.map(i=>i.name+' '+eurR(i.amount)).join(', ')+')':'')+'. Prélèvements : '+eur(st.P)+'. Épargne prévue : '+eur(st.savings)+'.'};
  if(hasWord(/prelev|abonnement|loyer|charges/))
    return {t:st.fixed.length?'Tes prélèvements automatiques ('+eur(st.P)+') :\n'+st.fixed.map(f=>'• '+f.icon+' '+f.name+' : '+eur(f.amount)+(f.day?' (le '+f.day+')':'')).join('\n'):'Tu n\'as pas encore de prélèvement enregistré.'};
  if(hasWord(/reste|disponible|dispo|combien (puis|je peux)|jour/)||hasWord(/^(salut|bonjour|coucou|hello|yo)/))
    return {t:'Il te reste **'+eur(Math.max(0,st.available))+'** sur tes enveloppes, soit environ '+eurR(Math.max(0,st.perDay))+' par jour pendant '+st.daysLeft+' jour'+(st.daysLeft>1?'s':'')+'.'+(st.available<0?' Tu es en dépassement de '+eur(-st.available)+'.':'')};
  if(hasWord(/depense|depens|combien.*(pris|paye|achete)|total/)){
    return {t:'Ce cycle, tu as dépensé **'+eur(st.envSpent)+'** sur tes enveloppes ('+eur(st.P)+' de prélèvements en plus).\n'+st.rows.filter(r=>r.cat.id&&r.spent>0).sort((a,b)=>b.spent-a.spent).map(r=>'• '+r.cat.icon+' '+r.cat.name+' : '+eur(r.spent)).join('\n')};
  }
  /* recherche d'un libellé */
  const toks=qTokens(q).filter(w=>!/^(combien|depense|depenses|achete|paye|cycle|mois|total|euros)$/.test(w));
  if(toks.length&&hasWord(/combien|total|depense/)){
    const match=o=>o.type==='depense'&&toks.some(w=>nrm(o.label).indexOf(w)>=0);
    const inC=st.ops.filter(match),all=S.operations.filter(match);
    if(all.length)return {t:'« '+toks.join(' ')+' » : **'+eur(sum(inC,o=>o.amount))+'** ce cycle ('+inC.length+' achat'+(inC.length>1?'s':'')+'), '+eur(sum(all,o=>o.amount))+' depuis le début ('+all.length+' achats).'};
  }
  return null;
}

/* ---------- intelligence proactive : abonnements cachés & dépenses inhabituelles ---------- */
function detectRecurring(){
  const cs=cyclesSorted();if(cs.length<2)return [];
  const known=S.recurring.map(r=>nrm(r.name));
  const groups={};
  S.operations.filter(o=>o.type==='depense'&&o.label).forEach(o=>{
    const key=(labelKey(o.label)||nrm(o.label))+'|'+Math.round(o.amount*100);
    const cy=cycleOfDate(o.date);if(!cy)return;
    const g=groups[key]||(groups[key]={label:o.label,amount:o.amount,cycles:{},days:[]});
    g.cycles[cy.id]=1;g.days.push(+o.date.slice(8));
  });
  return Object.keys(groups).map(k=>groups[k]).filter(g=>{
    if(Object.keys(g.cycles).length<2)return false;
    const dmin=Math.min(...g.days),dmax=Math.max(...g.days);
    if(dmax-dmin>4&&!(dmin<=3&&dmax>=28))return false;
    const nl=nrm(g.label);
    if(known.some(x=>x&&(nl.indexOf(x)>=0||x.indexOf(nl)>=0)))return false;
    if(S.categories.some(c=>nrm(c.name)===nl))return false;
    return g.amount>=3;
  }).sort((a,b)=>b.amount-a.amount).slice(0,3).map(g=>({label:g.label,amount:g.amount,day:Math.round(sum(g.days)/g.days.length)}));
}
function unusualExpense(st){
  const recent=st.ops.filter(o=>o.type==='depense'&&o.catId&&D.diff(o.date,S.today)<=4&&o.amount>=25);
  for(const o of recent){
    const prev=S.operations.filter(x=>x.type==='depense'&&x.catId===o.catId&&x.id!==o.id&&x.date<o.date);
    if(prev.length<4)continue;
    const avg=sum(prev,x=>x.amount)/prev.length;
    if(o.amount>=avg*2.5)return {o,avg};
  }
  return null;
}
