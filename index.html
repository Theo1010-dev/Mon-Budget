@media (prefers-color-scheme:dark){
  :root[data-theme=auto]{
    --bg:#1C1C1E; --surface:#2C2C2E; --surface2:#3A3A3C; --ink:#F2F2F7; --muted:#AEAEB2; --line:#48484A; --track:rgba(235,235,245,.18);
    --tint:#0A84FF; --pos:#30D158; --warn:#FF9F0A; --neg:#FF6961; --bar:rgba(44,44,46,.86); --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
body.hide .num,body.hide .amt,body.hide .big,body.hide .s,body.hide .r,body.hide .v,body.hide .kv b{filter:blur(7px)}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(130px + var(--safeb))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(14px + var(--safet)) 0 8px}
.top h1{margin:0;font:700 34px/1.1 var(--font);letter-spacing:-.025em}
.top .sub{font-size:14px;color:var(--muted);margin-top:4px}
.top .btns{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.iconbtn svg{width:19px;height:19px;stroke:var(--tint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.view{outline:none}

/* barre d'onglets translucide */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 6px calc(6px + var(--safeb))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px;font:600 10.5px var(--font);color:var(--muted)}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--tint)}
.fab{position:fixed;z-index:11;right:max(16px,calc(50vw - 264px));bottom:calc(84px + var(--safeb));width:62px;height:62px;border-radius:50%;border:0;background:var(--tint);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -6px rgba(0,122,255,.55)}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}

/* roue principale */
.hero{padding-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wheel{position:relative;width:min(88vw,350px);margin:12px auto 0;aspect-ratio:1}
.wheel svg{width:100%;height:100%;display:block;overflow:visible}
.wheel .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 62px}
.wheel .lbl{font-size:14px;color:var(--muted);font-weight:600}
.wheel .big{font:700 clamp(40px,13vw,56px)/1.05 var(--font);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.wheel .big.neg{color:var(--neg)}
.wheel .perday{font-size:13.5px;color:var(--muted);margin-top:6px}
.arc{fill:none;stroke-width:22;stroke-linecap:butt}
.arc.anim{stroke-dasharray:100;animation:draw .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.timering{fill:none;stroke:var(--track);stroke-width:3}
.timearc{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;opacity:.7}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{text-align:center;padding:12px 4px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.stat b{display:block;font:700 17px var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}

/* bandeau conseil */
.banner{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:14px;padding:14px;border-radius:var(--r);border:0;background:var(--surface);box-shadow:var(--shadow)}
.banner .dot{width:12px;height:12px;border-radius:50%;flex:none}
.banner .dot.ok{background:#34C759} .banner .dot.warn{background:#FF9500} .banner .dot.bad{background:#FF3B30} .banner .dot.info{background:var(--tint)}
.banner .t{font-weight:600;line-height:1.25}
.banner .x{font-size:14px;color:var(--muted)}
.banner .go{margin-left:auto;font-size:22px;color:var(--muted)}

/* sections (listes groupées iOS) */
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 4px 8px}
.sec-h h2{margin:0;font:700 22px/1.2 var(--font);letter-spacing:-.02em}
.sec-h .cap{font:600 13px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.link{background:none;border:0;padding:4px 0;font:500 16px var(--font);color:var(--tint)}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;background:none;border:0;text-align:left;position:relative;min-height:56px}
.row+.row::before,.row+.rowadd::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:.5px solid var(--line)}
.row.nobadge+.row::before,.row.nobadge+.rowadd::before{left:16px}
button.row:active{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13.5px;color:var(--muted)}
.row .amt{font:600 16px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .chev{color:var(--muted);opacity:.6;font-size:20px;margin-left:-4px}
.amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)}
.badge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none}
.rowadd{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:none;border:0;font:500 16px var(--font);color:var(--tint);position:relative}

/* pastilles de ton (conseils) */
.tdot{display:block;width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
.tdot.ok{background:#34C759} .tdot.warn{background:#FF9500} .tdot.bad{background:#FF3B30} .tdot.info{background:var(--tint)}

/* tuiles à anneau (enveloppes) */
.ringgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 12px;border-radius:var(--r);background:var(--surface);border:0;box-shadow:var(--shadow);min-width:0}
.tile:active{transform:scale(.97)}
.ring{position:relative;width:68px;height:68px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .em{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.tile b{font-size:13px;font-weight:600;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.tile .s{font:600 13.5px var(--font);font-variant-numeric:tabular-nums}
.tile .s.neg{color:var(--neg)}
.tile .s2{font-size:11.5px;color:var(--muted);margin-top:-4px}

.env-h{display:flex;align-items:center;gap:10px}
.env-h .n{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env-h .r{font:600 16px var(--font);font-variant-numeric:tabular-nums}
.env-f{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px}
.bar{position:relative;height:10px;border-radius:99px;background:var(--track)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar .fill.over{background:repeating-linear-gradient(135deg,#FF3B30 0 6px,#ff9aa0 6px 12px)!important}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--ink);opacity:.55}
.bar.thick{height:14px}

/* boutons / formulaires */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border:0;border-radius:14px;background:var(--tint);color:#fff;font:600 17px var(--font)}
.btn.ghost{background:var(--surface2);color:var(--tint)}
.btn.danger{background:transparent;color:var(--neg);box-shadow:inset 0 0 0 1.5px var(--neg)}
.btn.sm{height:36px;padding:0 15px;font-size:15px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;border:0;background:var(--surface);box-shadow:var(--shadow);font:500 14.5px var(--font);color:var(--ink);white-space:nowrap}
.sheet .chip,.panel .chip{background:var(--surface2);box-shadow:none}
.chip[aria-pressed=true]{background:var(--tint)!important;color:#fff}
.chip.static{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field>label,.lbl2{font:500 13px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin-left:4px}
input,select,textarea{width:100%;height:48px;border-radius:12px;border:0;background:var(--surface2);color:var(--ink);padding:0 14px;font:400 17px var(--font);-webkit-appearance:none;appearance:none}
.panel input,.panel select,.panel textarea,.sheet input,.sheet select,.sheet textarea{background:var(--surface2)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{height:auto;min-height:100px;padding:12px 14px;resize:vertical}
input[type=range]{height:34px;padding:0;accent-color:var(--tint);background:transparent;-webkit-appearance:auto;appearance:auto}
input[type=file]{display:none}
.amount{font:700 40px var(--font);height:74px;text-align:center;letter-spacing:-.03em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;background:var(--track);border-radius:10px}
.seg button{height:34px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:500 14px var(--font)}
.seg button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
:root[data-theme=dark] .seg button[aria-pressed=true]{background:#636366}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 3px transparent}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;border:0;background:var(--surface2);font-size:21px}
.emojis button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--tint)}
.bigtile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:14px;border:0;background:var(--surface2);font-weight:600}
.bigtile .em{font-size:26px}
.bigtile[aria-pressed=true]{box-shadow:inset 0 0 0 2.5px var(--tint);background:var(--surface)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.catpick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;border:0;background:var(--surface2);font-size:13px;font-weight:600;min-width:0}
.catpick .em{font-size:26px}
.catpick span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.catpick[aria-pressed=true]{box-shadow:inset 0 0 0 2.5px var(--tint);background:var(--surface)}
.catpick:active{transform:scale(.96)}
.help{font-size:13.5px;color:var(--muted);margin:8px 4px 0;line-height:1.4}
.switch{position:relative;display:inline-block;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--track);transition:.2s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+i{background:#34C759}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid var(--tint);outline-offset:2px}
.inrow{display:flex;align-items:center;gap:10px;padding:10px 16px;position:relative}
.inrow+.inrow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.inrow input.nm{flex:1;min-width:0;height:40px;background:transparent;padding:0;font-weight:500}
.inrow input.am{width:104px;height:40px;text-align:right;padding:0 10px;font-weight:600}
.inrow .del{background:none;border:0;color:var(--neg);font-size:20px;padding:4px 6px}

/* feuilles */
.sheet-root{position:fixed;inset:0;z-index:30;display:none}
.sheet-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(24px + var(--safeb));animation:up .26s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.tall{height:92vh;height:92dvh}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:5px;background:var(--track);margin:0 auto 14px}
.sheet h3{margin:4px 4px 4px;font:700 26px/1.2 var(--font);letter-spacing:-.025em}
.sheet .lead{margin:0 4px 6px;color:var(--muted);font-size:15px}
.sheet .panel,.sheet .list{box-shadow:none}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.sheet-actions .btn{flex:1}
.sheet-actions .btn.fit{flex:0 0 auto}

.toast{position:fixed;left:50%;bottom:calc(158px + var(--safeb));transform:translate(-50%,20px);max-width:90vw;display:flex;align-items:center;gap:14px;background:rgba(40,40,42,.94);color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:60;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.err{background:#D70015}
.toast button{background:none;border:0;color:#64D2FF;font-weight:700;padding:0}
.busy{position:fixed;top:0;left:0;right:0;height:3px;overflow:hidden;z-index:70;display:none}
.busy.on{display:block}
.busy i{display:block;height:100%;width:40%;background:var(--tint);animation:slide 1s infinite ease-in-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.empty{text-align:center;padding:36px 12px}
.empty h2{font:700 24px var(--font);margin:0 0 8px;letter-spacing:-.02em}
.empty p{margin:0 auto 18px;max-width:34ch;color:var(--muted)}
.splash{display:grid;place-items:center;height:60vh;color:var(--muted)}

/* budget & historique */
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line);font-size:16px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted)}
.donutwrap{position:relative;width:min(70vw,250px);margin:4px auto 0;aspect-ratio:1}
.donutwrap svg{width:100%;height:100%;display:block}
.donutwrap .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 48px}
.donutwrap .c b{font:700 30px/1.1 var(--font);letter-spacing:-.03em}
.donutwrap .c span{font-size:13px;color:var(--muted)}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:16px}
.leg div{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{font-variant-numeric:tabular-nums;font-weight:600}
details.month{border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);margin-bottom:12px}
details.month>summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px}
details.month>summary::-webkit-details-marker{display:none}
details.month .body{padding:0 16px 14px}
.mring{position:relative;width:62px;height:62px;flex:none}
.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring span{position:absolute;inset:0;display:grid;place-items:center;font:700 14px var(--font)}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mh b{font:600 17px var(--font)}
.cmini{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.cmini .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 10px var(--font)}
.tune{padding:6px 0 2px}
.tune .lab{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin-top:10px}
.tune .lab span{color:var(--muted);font-weight:500;font-size:14px}

/* apprendre */
.lesson-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.lesson-card .no{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:700 17px var(--font);background:var(--surface2);flex:none}
.lesson-card.done .no{background:#34C759;color:#fff}
.prose p{margin:0 0 12px;font-size:17px;line-height:1.5;max-width:62ch}
.prose h4{font:700 19px var(--font);margin:22px 0 8px;letter-spacing:-.01em}
.prose ul{margin:0 0 14px;padding-left:20px}
.prose ol{margin:0 0 14px;padding-left:22px}
.prose ol li{margin:8px 0}
.prose li{margin:5px 0}
.callout{border-radius:14px;padding:13px 15px;margin:14px 0;font-size:15.5px;border-left:4px solid var(--tint);background:var(--surface)}
.callout.warn{border-color:#FF9500} .callout.tip{border-color:#34C759}
.callout b{display:block;margin-bottom:2px}
.ladder .li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-bottom:.5px solid var(--line)}
.ladder .li:last-child{border-bottom:0}
.dots{display:flex;gap:3px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--tint)}
details.env-d{border-bottom:.5px solid var(--line);padding:2px 0}
details.env-d summary{list-style:none;padding:12px 0;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
details.env-d summary::-webkit-details-marker{display:none}
details.env-d summary::after{content:"+";margin-left:auto;font:500 22px var(--font);color:var(--muted)}
details.env-d[open] summary::after{content:"–"}
details.env-d .kv2{padding:0 0 12px;font-size:15px}
.kv2 div{padding:3px 0}
.kv2 span{color:var(--muted)}
.quiz{margin-top:22px;padding-top:16px;border-top:.5px solid var(--line)}
.opt{display:block;width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:13px 14px;margin-top:8px;font-weight:500}
.opt.good{box-shadow:inset 0 0 0 2px #34C759;background:rgba(52,199,89,.14)}
.opt.bad{box-shadow:inset 0 0 0 2px #FF3B30;background:rgba(255,59,48,.12)}
.simbox{background:var(--surface);border-radius:16px;padding:14px;margin:14px 0}
.simbox .res{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.simbox .res div{flex:1;min-width:90px}
.simbox .res b{display:block;font:700 21px var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.srch{margin-bottom:12px}
.term{padding:12px 0;border-bottom:.5px solid var(--line)}
.term b{display:block}


/* vue d'ensemble */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}

<script>
'use strict';

/* =====================================================================
   1. UTILITAIRES
   ===================================================================== */
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const r5=n=>Math.round(n/5)*5;
const f5=n=>Math.floor(n/5)*5;
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const nf0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
function eur(n,two){const v=r2(n);return (two||!Number.isInteger(v)?nf2:nf0).format(v===0?0:v);}
function eurR(n){const v=Math.round(+n||0);return nf0.format(v===0?0:v);}
function parseNum(s){const v=parseFloat(String(s==null?'':s).replace(/[\s\u00a0\u202f]/g,'').replace(/[−–]/g,'-').replace(',','.'));return isFinite(v)?v:NaN;}
const fnum=n=>String(n).replace('.',',');
const D={
  p:s=>{const a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2]);},
  f:ms=>new Date(ms).toISOString().slice(0,10),
  diff:(a,b)=>Math.round((D.p(b)-D.p(a))/864e5),
  add:(s,n)=>D.f(D.p(s)+n*864e5)
};
function dShort(s){return new Date(D.p(s)).toLocaleDateString('fr-FR',{day:'numeric',month:'short',timeZone:'UTC'});}
function dLong(s){return new Date(D.p(s)).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}
function fmtPct(n){return (Math.round(n*10)/10).toString().replace('.',',')+' %';}

const C={blue:'#007AFF',green:'#34C759',orange:'#FF9500',red:'#FF3B30',purple:'#AF52DE',indigo:'#5856D6',teal:'#30B0C7',pink:'#FF2D55',yellow:'#FFCC00',gray:'#8E8E93'};
const PALETTE=[C.green,C.orange,C.indigo,C.blue,C.red,C.teal,C.pink,C.purple,C.yellow,C.gray];
const KINDS={
  livret_a:{label:'Livret A',color:C.green,ceiling:22950,rate:1.7,safe:true},
  ldds:{label:'LDDS',color:C.teal,ceiling:12000,rate:1.7,safe:true},
  lep:{label:'LEP',color:C.blue,ceiling:10000,rate:2.5,safe:true},
  pel:{label:'PEL',color:C.gray,ceiling:61200,rate:0,safe:true},
  livret_jeune:{label:'Livret Jeune',color:C.yellow,ceiling:1600,rate:0,safe:true},
  livret_banque:{label:'Livret bancaire',color:'#A2845E',ceiling:0,rate:0,safe:true},
  pea:{label:'PEA',color:C.indigo,ceiling:150000,rate:0,safe:false},
  pea_jeune:{label:'PEA Jeune',color:C.purple,ceiling:20000,rate:0,safe:false},
  pea_pme:{label:'PEA-PME',color:'#BF5AF2',ceiling:225000,rate:0,safe:false},
  assurance_vie:{label:'Assurance-vie',color:C.orange,ceiling:0,rate:0,safe:false},
  cto:{label:'Compte-titres',color:C.pink,ceiling:0,rate:0,safe:false},
  per:{label:'PER',color:'#64D2FF',ceiling:0,rate:0,safe:false},
  autre:{label:'Autre',color:C.gray,ceiling:0,rate:0,safe:true}
};
const EMOJIS=['🛒','⛽','🎉','🍔','☕','🚗','🏠','📱','🛡️','💊','🎬','🎮','👕','✈️','🏋️','📚','🎁','🐶','🧰','💡','🚌','🍺','💈','📺'];
const UNCAT={id:'',name:'Sans catégorie',icon:'•',color:C.gray,type:'fixe'};
const INCOME_PRESETS=[['Aide au logement (APL)','🏠'],['Prime d\'activité','💶'],['Bourse','🎓'],['Aide de la famille','👪'],['Loyer perçu','🔑'],['Autre revenu','➕']];
const DEBIT_PRESETS=[['Loyer','🏠'],['Téléphone','📱'],['Assurance','🛡️'],['Abonnements','📺'],['Électricité','💡'],['Frais bancaires','🏦'],['Transport','🚌'],['Salle de sport','🏋️']];

/* =====================================================================
   2. RÈGLE DE CALCUL DU BUDGET (partagée stockage + interface)
   Revenus − prélèvements − enveloppes fixes − épargne = reste réparti entre
   les enveloppes variables (essence, fun…) selon leurs « parts ».
   ===================================================================== */
function computeBudgets(income,rate,cats,fixedList,savingsOverride){
  const P=sum(fixedList||[],f=>+f.amount||0);
  const fixes=cats.filter(k=>k.type==='fixe'),vars=cats.filter(k=>k.type==='variable');
  const F=sum(fixes,k=>+k.amount||0);
  let S=savingsOverride!=null?savingsOverride:r5(income*rate/100),tight=false;
  if(savingsOverride==null&&income>0){
    const minPool=vars.length?r5(income*0.10):0;
    if(income-P-F-S<minPool){S=Math.max(0,r5(income-P-F-minPool));tight=true;}
  }
  const pool=Math.max(0,income-P-F-S);
  const budgets={};
  fixes.forEach(k=>budgets[k.id]=+k.amount||0);
  const W=sum(vars,k=>k.weight>0?+k.weight:0);
  let used=0;
  vars.forEach(k=>{
    const w=W>0?(k.weight>0?+k.weight:0)/W:1/vars.length;
    const v=income>0?Math.max(0,r5(pool*w)):0;
    budgets[k.id]=v;used+=v;
  });
  if(vars.length&&used>pool+0.004){
    /* l'arrondi ne doit jamais dépasser ce qui reste : on retire l'excédent à la plus grosse enveloppe */
    let over=r2(used-pool);
    vars.slice().sort((a,b)=>budgets[b.id]-budgets[a.id]).forEach(k=>{
      if(over<=0)return;
      const cut=Math.min(budgets[k.id],over);budgets[k.id]=r2(budgets[k.id]-cut);over=r2(over-cut);
    });
    used=r2(sum(vars,k=>budgets[k.id]));
  }
  if(savingsOverride==null&&income>0&&vars.length)S=Math.max(0,r2(income-P-F-used));
  return {budgets,savings:r2(S),pool,tight,over:income>0&&(P+F>income)};
}
const totalIncome=cy=>r2((+cy.income||0)+(+cy.extra||0));

/* =====================================================================
   3. STOCKAGE LOCAL (tout reste sur ton téléphone)
   ===================================================================== */
const Backend=(function(){
  const KEY='monbudget.v2';
  let db=null,mem=false,undoStack=[];
  const rid=p=>p+'_'+Math.random().toString(36).slice(2,10);
  const pad=n=>String(n).padStart(2,'0');
  function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function seed(){
    return {v:2,
      incomeSources:[{id:'inc_salaire',name:'Salaire',icon:'💼',amount:0,day:0}],
      categories:[
        {id:'cat_courses',name:'Courses',icon:'🛒',type:'fixe',amount:150,weight:0,color:C.green,active:true,order:1},
        {id:'cat_imprevus',name:'Imprévus',icon:'🧰',type:'fixe',amount:40,weight:0,color:C.orange,active:true,order:2},
        {id:'cat_essence',name:'Essence',icon:'⛽',type:'variable',amount:0,weight:40,color:C.indigo,active:true,order:3},
        {id:'cat_fun',name:'Fun',icon:'🎉',type:'variable',amount:0,weight:60,color:C.pink,active:true,order:4}
      ],
      recurring:[],cycles:[],operations:[],goals:[],
      livrets:[{id:'liv_a',name:'Livret A',kind:'livret_a',rate:1.7,ceiling:22950,startBalance:0,color:C.green,active:true,paused:false,marketValue:null,valueDate:'',valueHistory:[]}],
      profiles:[
        {id:'prof_normal',name:'Normal',icon:'⚖️',rate:20},
        {id:'prof_vacances',name:'Vacances',icon:'🌴',rate:10},
        {id:'prof_restreint',name:'Restreint',icon:'🧊',rate:30},
        {id:'prof_eco',name:'Éco max',icon:'🔥',rate:40}
      ],
      settings:{}};
  }
  function upgrade(o){
    if(!Array.isArray(o.incomeSources)||!o.incomeSources.length)o.incomeSources=[{id:'inc_salaire',name:'Salaire',icon:'💼',amount:0,day:0}];
    if(!Array.isArray(o.goals))o.goals=[];
    if(!Array.isArray(o.recurring))o.recurring=[];
    if(!o.settings||typeof o.settings!=='object')o.settings={};
    o.livrets.forEach(l=>{if(l.paused==null)l.paused=false;if(l.marketValue===undefined)l.marketValue=null;if(!l.valueDate)l.valueDate='';if(!Array.isArray(l.valueHistory))l.valueHistory=[];});
    return o;
  }
  function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.v===2)return upgrade(o);}}catch(e){}return null;}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));mem=false;return true;}catch(e){mem=true;return false;}}
  db=load()||seed();
  try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t');}catch(e){mem=true;}

  function num(v){return typeof v==='number'?v:parseFloat(String(v==null?'':v).replace(/[\s\u00a0\u202f]/g,'').replace(',','.'));}
  function isoDate(s){
    s=String(s||'');const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if(!m)throw new Error('Date invalide.');
    const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
    if(d.getUTCFullYear()!==+m[1]||d.getUTCMonth()!==+m[2]-1||d.getUTCDate()!==+m[3])throw new Error('Date invalide.');
    return s;
  }
  const colorOr=(c,d)=>/^#[0-9a-fA-F]{6}$/.test(String(c||''))?String(c):d;
  const find=(l,id)=>l.find(x=>x.id===id)||null;
  const sorted=()=>db.cycles.slice().sort((a,b)=>a.start<b.start?-1:(a.start>b.start?1:0));
  const cur=()=>{const s=sorted();return s.length?s[s.length-1]:null;};
  const prof=id=>find(db.profiles,id);

  function cleanIncomes(list){
    return (list||[]).map(x=>({id:x.id||rid('inc'),name:String(x.name||'Revenu').trim().slice(0,40)||'Revenu',icon:String(x.icon||'💶').slice(0,8),amount:r2(num(x.amount)||0)}))
      .filter(x=>x.amount>0);
  }
  function rebalance(cy){
    const cats=db.categories.filter(k=>k.active!==false);
    const c=computeBudgets(totalIncome(cy),cy.rate||0,cats,cy.fixed||[],null);
    cy.budgets=c.budgets;cy.savings=c.savings;cy.manual=false;
  }
  function fillMissing(cy){db.categories.forEach(k=>{if(cy.budgets[k.id]==null)cy.budgets[k.id]=k.type==='fixe'?k.amount:0;});}
  function refreshCurrent(){const cy=cur();if(!cy)return;if(cy.manual)fillMissing(cy);else rebalance(cy);}
  function buildCycle(date,incomes,profile){
    const fixed=db.recurring.filter(r=>r.active!==false).map(r=>({id:r.id,name:r.name,icon:r.icon,amount:r.amount,day:r.day||0}));
    const inc=cleanIncomes(incomes);
    const cy={id:rid('cy'),start:date,income:r2(sum(inc,x=>x.amount)),incomes:inc,extra:0,profileId:profile?profile.id:'',rate:profile?profile.rate:0,
      fixed,budgets:{},savings:0,manual:false,note:''};
    rebalance(cy);
    return cy;
  }
  /* rentrées exceptionnelles : rattachées au cycle de leur date */
  function recomputeExtras(){
    const cs=sorted();
    if(!cs.length)return;
    const extra={};cs.forEach(c=>extra[c.id]=0);
    db.operations.forEach(o=>{
      if(o.type!=='revenu')return;
      let f=cs[0];for(const c of cs){if(c.start<=o.date)f=c;}
      extra[f.id]+=o.amount-(o.toSavings||0);
    });
    cs.forEach(c=>{c.extra=r2(extra[c.id]);});
    refreshCurrent();
  }

  function balanceOf(id,exclude){
    const l=find(db.livrets,id);if(!l)return 0;
    let b=l.startBalance;
    db.operations.forEach(o=>{
      if(o.id===exclude||o.livretId!==id)return;
      if(o.type==='epargne'||o.type==='interet')b+=o.amount;
      else if(o.type==='retrait')b-=o.amount;
      else if(o.type==='revenu')b+=o.toSavings||0;
    });
    return b;
  }
  /* un livret en pause ou plein ne reçoit plus de versement */
  function checkDeposit(l,amount,excludeId){
    const prev=excludeId?db.operations.find(o=>o.id===excludeId):null;
    const same=prev&&prev.livretId===l.id;
    if(l.paused&&!same)throw new Error('Les versements sont en pause sur « '+l.name+' ». Réactive-les dans la fiche du livret.');
    if(l.ceiling>0&&!(same&&amount<=prev.amount+0.005)){
      const b=balanceOf(l.id,excludeId);
      if(b+amount>l.ceiling+0.005)throw new Error('Plafond atteint sur « '+l.name+' » : il reste '+eur(Math.max(0,l.ceiling-b))+' de marge.');
    }
  }

  const A={
    saveOperation(p){
      const type=String(p.type||'depense');
      if(['depense','epargne','retrait','interet','revenu'].indexOf(type)<0)throw new Error("Type d'opération inconnu.");
      const date=isoDate(p.date);
      let amount=num(p.amount);
      if(!isFinite(amount)||amount===0)throw new Error('Saisis un montant valide.');
      if(type!=='depense'&&amount<0)throw new Error('Le montant doit être positif.');
      amount=r2(amount);
      let catId='',livretId='',def='',toSavings=0;
      if(type==='depense'){
        if(p.catId){const k=find(db.categories,p.catId);if(!k)throw new Error('Catégorie introuvable.');catId=k.id;def=k.name;}
        else def='Dépense';
      }else if(type==='revenu'){
        toSavings=r2(Math.max(0,num(p.toSavings==null||p.toSavings===''?0:p.toSavings)||0));
        if(toSavings>amount)throw new Error('La part épargnée dépasse le montant reçu.');
        if(toSavings>0){const l=find(db.livrets,p.livretId);if(!l)throw new Error('Choisis le livret qui reçoit la part épargnée.');checkDeposit(l,toSavings,p.id);livretId=l.id;}
        def='Rentrée d\'argent';
      }else{
        const l=find(db.livrets,p.livretId);
        if(!l)throw new Error('Choisis un livret.');
        if(type==='epargne')checkDeposit(l,amount,p.id);
        livretId=l.id;
        def=type==='epargne'?'Virement vers '+l.name:(type==='retrait'?'Retrait de '+l.name:'Intérêts '+l.name);
      }
      const label=String(p.label||'').trim().slice(0,120)||def;
      const op={id:p.id||rid('op'),date,type,catId,label,amount,livretId};
      if(type==='revenu')op.toSavings=toSavings;
      if(p.id){const i=db.operations.findIndex(o=>o.id===p.id);if(i<0)throw new Error('Opération introuvable.');db.operations[i]=op;}
      else db.operations.push(op);
      return {id:op.id};
    },
    deleteOperation(p){
      const n=db.operations.length;db.operations=db.operations.filter(o=>o.id!==p.id);
      if(db.operations.length===n)throw new Error('Opération introuvable.');
      return {id:p.id};
    },
    startCycle(p){
      const cs=sorted(),date=isoDate(p.date);
      if(cs.length&&date<=cs[cs.length-1].start)throw new Error('La date doit être après le début du cycle en cours ('+cs[cs.length-1].start+').');
      let rows=p.sources;
      if(!Array.isArray(rows)){
        const inc=num(p.income);
        if(!isFinite(inc)||inc<0)throw new Error('Montant de paie invalide.');
        rows=[{id:'inc_salaire',name:'Salaire',icon:'💼',amount:inc,on:true}];
      }
      rows.forEach(r=>{const v=num(r.amount);if(r.amount!==''&&r.amount!=null&&(!isFinite(v)||v<0))throw new Error('Montant invalide pour '+(r.name||'un revenu')+'.');});
      // modèles de revenus mémorisés pour les prochaines paies
      db.incomeSources=rows.filter(r=>String(r.name||'').trim()).map(r=>({id:r.id||rid('inc'),name:String(r.name).trim().slice(0,40),icon:String(r.icon||'💶').slice(0,8),amount:r2(num(r.amount)||0),day:0}));
      if(!db.incomeSources.length)db.incomeSources=[{id:'inc_salaire',name:'Salaire',icon:'💼',amount:0,day:0}];
      const used=rows.filter(r=>r.on!==false);
      const cy=buildCycle(date,used,prof(p.profileId)||db.profiles[0]||null);
      db.cycles.push(cy);
      return {id:cy.id};
    },
    updateCycle(p){
      const cs=sorted();const idx=cs.findIndex(c=>c.id===p.id);
      if(idx<0)throw new Error('Cycle introuvable.');
      const cy=db.cycles.find(c=>c.id===p.id);
      let changed=false;
      if(p.start!==undefined){
        const s=isoDate(p.start);
        if(idx>0&&s<=cs[idx-1].start)throw new Error('La date doit être après le cycle précédent.');
        if(idx<cs.length-1&&s>=cs[idx+1].start)throw new Error('La date doit être avant le cycle suivant.');
        cy.start=s;
      }
      if(Array.isArray(p.incomes)){
        p.incomes.forEach(r=>{const v=num(r.amount);if(r.amount!==''&&r.amount!=null&&(!isFinite(v)||v<0))throw new Error('Montant invalide pour '+(r.name||'un revenu')+'.');});
        const inc=cleanIncomes(p.incomes);
        cy.incomes=inc;const t=r2(sum(inc,x=>x.amount));if(t!==cy.income)changed=true;cy.income=t;
      }else if(p.income!==undefined){
        const v=num(p.income);if(!isFinite(v)||v<0)throw new Error('Montant de paie invalide.');
        if(r2(v)!==cy.income)changed=true;cy.income=r2(v);cy.incomes=v>0?[{id:'inc_salaire',name:'Salaire',icon:'💼',amount:r2(v)}]:[];
      }
      if(p.profileId!==undefined){
        const pr=prof(p.profileId);if(!pr)throw new Error('Profil introuvable.');
        if(p.profileId!==cy.profileId){changed=true;cy.profileId=pr.id;cy.rate=pr.rate;}
      }
      if(p.note!==undefined)cy.note=String(p.note).slice(0,300);
      if(p.recalc||(changed&&!cy.manual))rebalance(cy);
      return {id:cy.id};
    },
    deleteCycle(p){
      const n=db.cycles.length;db.cycles=db.cycles.filter(c=>c.id!==p.id);
      if(db.cycles.length===n)throw new Error('Cycle introuvable.');
      return {id:p.id};
    },
    setBudgets(p){
      const cy=find(db.cycles,p.cycleId);if(!cy)throw new Error('Cycle introuvable.');
      const inc=p.budgets||{};let touchedFlex=false;
      Object.keys(inc).forEach(id=>{
        const k=find(db.categories,id);if(!k)return;
        const v=num(inc[id]);
        if(!isFinite(v)||v<0)throw new Error('Budget invalide pour '+k.name+'.');
        if(k.type==='fixe'){k.amount=r2(v);cy.budgets[id]=r2(v);}
        else{cy.budgets[id]=r2(v);touchedFlex=true;}
      });
      if(p.savings!==undefined){
        const s=num(p.savings);if(!isFinite(s)||s<0)throw new Error("Montant d'épargne invalide.");
        cy.savings=r2(s);touchedFlex=true;
      }
      if(touchedFlex)cy.manual=true;
      else if(!cy.manual)rebalance(cy);
      return {id:cy.id};
    },
    /* jauges interactives : taux d'épargne + parts des enveloppes variables */
    tuneCycle(p){
      const cy=find(db.cycles,p.cycleId);if(!cy)throw new Error('Cycle introuvable.');
      if(p.rate!==undefined){const r=num(p.rate);if(!isFinite(r)||r<0||r>90)throw new Error("Taux d'épargne invalide (0 à 90 %).");cy.rate=r2(r);}
      Object.keys(p.weights||{}).forEach(id=>{const k=find(db.categories,id);const w=num(p.weights[id]);if(k&&k.type==='variable'&&isFinite(w))k.weight=Math.max(1,Math.round(w));});
      rebalance(cy);
      return {id:cy.id};
    },
    recalcCycle(p){const cy=find(db.cycles,p.id);if(!cy)throw new Error('Cycle introuvable.');rebalance(cy);return {id:cy.id};},
    applyProposal(p){
      const cy=find(db.cycles,p.cycleId);if(!cy)throw new Error('Cycle introuvable.');
      Object.keys(p.fixedAmounts||{}).forEach(id=>{const k=find(db.categories,id);if(k&&k.type==='fixe')k.amount=r2(num(p.fixedAmounts[id])||0);});
      Object.keys(p.weights||{}).forEach(id=>{const k=find(db.categories,id);if(k&&k.type==='variable')k.weight=Math.max(1,Math.round(num(p.weights[id])||1));});
      if(p.rate!==undefined){const r=num(p.rate);if(isFinite(r)&&r>=0&&r<=90)cy.rate=r2(r);}
      rebalance(cy);
      return {id:cy.id};
    },
    saveCategory(p){
      const ex=p.id?find(db.categories,p.id):null;
      if(p.id&&!ex)throw new Error('Catégorie introuvable.');
      const name=String(p.name||'').trim().slice(0,30);
      if(!name)throw new Error('Donne un nom à la catégorie.');
      const type=p.type==='variable'?'variable':'fixe';
      const amount=num(p.amount===''||p.amount==null?0:p.amount),weight=num(p.weight===''||p.weight==null?0:p.weight);
      if(!isFinite(amount)||amount<0)throw new Error('Montant invalide.');
      if(!isFinite(weight)||weight<0)throw new Error('Part invalide.');
      const k=ex||{id:rid('cat'),active:true,order:db.categories.reduce((m,c)=>Math.max(m,c.order||0),0)+1};
      k.name=name;k.icon=String(p.icon||(ex?ex.icon:'🏷️')).slice(0,8);k.type=type;
      k.amount=type==='fixe'?r2(amount):0;
      k.weight=type==='variable'?Math.max(1,Math.round(weight||50)):0;
      k.color=colorOr(p.color,ex?ex.color:PALETTE[db.categories.length%PALETTE.length]);
      if(!ex)db.categories.push(k);
      refreshCurrent();
      return {id:k.id};
    },
    deleteCategory(p){
      const k=find(db.categories,p.id);if(!k)throw new Error('Catégorie introuvable.');
      db.categories=db.categories.filter(c=>c.id!==p.id);
      db.operations.forEach(o=>{if(o.catId===p.id)o.catId='';});
      db.cycles.forEach(c=>{if(c.budgets)delete c.budgets[p.id];});
      refreshCurrent();
      return {id:p.id};
    },
    saveRecurring(p){
      const ex=p.id?find(db.recurring,p.id):null;
      if(p.id&&!ex)throw new Error('Prélèvement introuvable.');
      const name=String(p.name||'').trim().slice(0,40);
      if(!name)throw new Error('Donne un nom au prélèvement.');
      const amount=num(p.amount);
      if(!isFinite(amount)||amount<0)throw new Error('Montant invalide.');
      const day=p.day===''||p.day==null?0:parseInt(p.day,10);
      if(!isFinite(day)||day<0||day>31)throw new Error('Jour invalide (1 à 31).');
      const r=ex||{id:rid('rec'),active:true};
      r.name=name;r.icon=String(p.icon||(ex?ex.icon:'🔁')).slice(0,8);r.amount=r2(amount);r.day=day;
      if(!ex)db.recurring.push(r);
      const cy=cur();
      if(cy){
        cy.fixed=cy.fixed||[];
        const entry={id:r.id,name:r.name,icon:r.icon,amount:r.amount,day:r.day};
        const i=cy.fixed.findIndex(f=>f.id===r.id);
        if(i>=0)cy.fixed[i]=entry;else cy.fixed.push(entry);
        if(!cy.manual)rebalance(cy);
      }
      return {id:r.id};
    },
    deleteRecurring(p){
      const n=db.recurring.length;db.recurring=db.recurring.filter(r=>r.id!==p.id);
      if(db.recurring.length===n)throw new Error('Prélèvement introuvable.');
      const cy=cur();
      if(cy){cy.fixed=(cy.fixed||[]).filter(f=>f.id!==p.id);if(!cy.manual)rebalance(cy);}
      return {id:p.id};
    },
    saveLivret(p){
      const ex=p.id?find(db.livrets,p.id):null;
      if(p.id&&!ex)throw new Error('Livret introuvable.');
      const name=String(p.name||'').trim().slice(0,40);
      if(!name)throw new Error('Donne un nom au livret.');
      const z=v=>v===''||v==null?0:num(v);
      const rate=z(p.rate),ceiling=z(p.ceiling),start=z(p.startBalance);
      if(!isFinite(rate)||rate<0||rate>30)throw new Error('Taux invalide (0 à 30 %).');
      if(!isFinite(ceiling)||ceiling<0)throw new Error('Plafond invalide.');
      if(!isFinite(start))throw new Error('Solde de départ invalide.');
      const l=ex||{id:rid('liv'),active:true,paused:false,marketValue:null,valueDate:'',valueHistory:[]};
      l.name=name;l.kind=String(p.kind||'autre').slice(0,30);l.rate=r2(rate);l.ceiling=r2(ceiling);l.startBalance=r2(start);
      l.color=colorOr(p.color,ex?ex.color:C.green);
      if(p.active!==undefined)l.active=!!p.active;
      if(p.paused!==undefined)l.paused=!!p.paused;
      if(!ex)db.livrets.push(l);
      return {id:l.id};
    },
    setLivretValues(p){
      const date=isoDate(p.date||today());
      Object.keys(p.values||{}).forEach(id=>{
        const l=find(db.livrets,id);if(!l)return;
        const raw=p.values[id];
        if(raw===''||raw==null){l.marketValue=null;l.valueDate='';return;}
        const v=num(raw);
        if(!isFinite(v)||v<0)throw new Error('Valeur invalide pour '+l.name+'.');
        l.marketValue=r2(v);l.valueDate=date;
        l.valueHistory=(l.valueHistory||[]).filter(h=>h.date!==date).concat([{date,value:r2(v)}]).sort((a,b)=>a.date<b.date?-1:1).slice(-120);
      });
      return {ok:true};
    },
    deleteLivret(p){
      const l=find(db.livrets,p.id);if(!l)throw new Error('Livret introuvable.');
      db.livrets=db.livrets.filter(x=>x.id!==p.id);
      db.operations=db.operations.filter(o=>o.livretId!==p.id);
      db.goals.forEach(g=>{if(g.livretId===p.id)g.livretId='';});

    },
    saveProfile(p){

      if(!name)throw new Error('Donne un nom au profil.');
      const rate=num(p.rate);
      if(!isFinite(rate)||rate<0||rate>90)throw new Error("Taux d'épargne invalide (0 à 90 %).");
      const pr=ex||{id:rid('prof')};
      pr.name=name;pr.icon=String(p.icon||(ex?ex.icon:'✨')).slice(0,8);pr.rate=r2(rate);
      if(!ex)db.profiles.push(pr);
      return {id:pr.id};
    },
    deleteProfile(p){
      if(!prof(p.id))throw new Error('Profil introuvable.');
      if(db.profiles.length<=1)throw new Error('Garde au moins un profil.');
      db.profiles=db.profiles.filter(x=>x.id!==p.id);
      return {id:p.id};
    },
    saveGoal(p){
      const ex=p.id?find(db.goals,p.id):null;
      if(p.id&&!ex)throw new Error('Objectif introuvable.');
      const name=String(p.name||'').trim().slice(0,40);
      if(!name)throw new Error("Donne un nom à l'objectif.");
      const target=num(p.target);
      if(!isFinite(target)||target<=0)throw new Error('Indique le montant à atteindre.');
      const date=p.date?isoDate(p.date):'';
      const livretId=p.livretId&&find(db.livrets,p.livretId)?p.livretId:'';
      const g=ex||{id:rid('goal')};
      g.name=name;g.icon=String(p.icon||(ex?ex.icon:'🎯')).slice(0,8);g.target=r2(target);g.date=date;g.livretId=livretId;
      g.color=colorOr(p.color,ex?ex.color:C.blue);
      if(!ex)db.goals.push(g);
      return {id:g.id};
    },
    deleteGoal(p){
      const n=db.goals.length;db.goals=db.goals.filter(g=>g.id!==p.id);
      if(db.goals.length===n)throw new Error('Objectif introuvable.');
      return {id:p.id};
    },
    saveSettings(p){
      const ok=['setupDone','cycleLen','strategy','learn','lastBackup','theme','hide','catRules','tourDone'];
      const v=p.values||{};
      Object.keys(v).forEach(k=>{if(ok.indexOf(k)<0)throw new Error('Réglage inconnu : '+k);db.settings[k]=v[k]==null?'':String(v[k]);});
      return {saved:Object.keys(v)};
    },
    applyBilan(p){
      const date=isoDate(p.date||today());
      (p.lines||[]).forEach(l=>{
        const amt=num(l.amount);
        if(!(amt>0))return;
        A.saveOperation({type:'epargne',date,livretId:l.livretId,amount:amt,label:l.label||'Bilan de fin de cycle'});
      });
      return {n:(p.lines||[]).length};
    },
    importOps(p){
      let n=0;
      (p.ops||[]).forEach(o=>{A.saveOperation({type:'depense',date:o.date,catId:o.catId,amount:o.amount,label:o.label});n++;});
      return {n};
    },
    importData(p){
      let o;try{o=JSON.parse(p.text);}catch(e){throw new Error("Ce fichier n'est pas une sauvegarde valide.");}
      if(!o||o.v!==2||!Array.isArray(o.categories)||!Array.isArray(o.cycles)||!Array.isArray(o.operations)||!Array.isArray(o.livrets)||!Array.isArray(o.profiles))throw new Error("Ce fichier n'est pas une sauvegarde de Mon Budget.");
      db=upgrade(o);return {ok:true};
    },
    resetAll(){db=seed();return {ok:true};}
  };
  const NO_UNDO={saveSettings:1};

  function state(){const s=JSON.parse(JSON.stringify(db));s.today=today();s.memOnly=mem;return s;}
  function api(action,payload){
    try{
      payload=payload||{};
      if(action==='bootstrap')return {ok:true,result:null,state:state()};
      if(action==='export')return {ok:true,result:JSON.stringify(Object.assign({exportedAt:today()},db)),state:state()};
      if(action==='undo'){
        const snap=undoStack.pop();
        if(!snap)throw new Error('Rien à annuler.');
        db=JSON.parse(snap);persist();
        return {ok:true,result:null,state:state()};
      }
      const fn=A[action];
      if(!fn)throw new Error('Action inconnue : '+action);
      const snap=JSON.stringify(db);
      let result;
      try{result=fn(payload);if(action!=='saveSettings')recomputeExtras();}
      catch(e){db=JSON.parse(snap);throw e;}
      if(!NO_UNDO[action]){undoStack.push(snap);if(undoStack.length>8)undoStack.shift();}
      persist();
      return {ok:true,result,state:state()};
    }catch(e){return {ok:false,error:String(e&&e.message?e.message:e)};}
  }
  return {api,today,compute:computeBudgets,hasUndo:()=>undoStack.length>0};
})();

let S=null;
const UI={tab:'home',hist:'mois',filter:{cycle:'all',cat:'all',q:'',lim:60},learn:'parcours',animated:false,glossQ:'',setupStep:1};
function call(action,payload){
  return new Promise((resolve,reject)=>{
    const r=Backend.api(action,payload);
    if(r.ok)resolve(r);else reject(new Error(r.error||'Erreur'));
  });
}
let busyN=0;
function busy(on){busyN+=on?1:-1;const b=$('#busy');if(b)b.classList.toggle('on',busyN>0);}
let toastT=null;
function toast(msg,err,undo){
  const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">Annuler</button>':'');
  t.classList.toggle('err',!!err);t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),err?4200:(undo?6000:2200));
}
async function act(action,payload,okMsg,undoable){
  busy(true);
  try{
    const r=await call(action,payload);
    S=r.state;UI.sd=null;
    if(okMsg)toast(okMsg,false,undoable);
    render();
    return r;
  }catch(e){toast(e.message,true);return null;}
  finally{busy(false);}
}

/* =====================================================================
   5. MOTEUR D'ANALYSE (cycles, statistiques, conseils, propositions)
   ===================================================================== */
const catById=id=>S.categories.find(k=>k.id===id)||null;
const profileById=id=>S.profiles.find(p=>p.id===id)||null;
const livretById=id=>S.livrets.find(l=>l.id===id)||null;
const cyclesSorted=()=>S.cycles.slice().sort((a,b)=>a.start<b.start?-1:(a.start>b.start?1:0));
const currentCycle=()=>{const cs=cyclesSorted();return cs.length?cs[cs.length-1]:null;};
function cycleEnd(c){const cs=cyclesSorted();const i=cs.findIndex(x=>x.id===c.id);return (i>=0&&i<cs.length-1)?cs[i+1].start:null;}
function cycleOfDate(date){const cs=cyclesSorted();if(!cs.length)return null;let f=cs[0];for(const c of cs){if(c.start<=date)f=c;}return f;}
function opsByCycle(){
  if(!S._ob){const m={};S.operations.forEach(o=>{const c=cycleOfDate(o.date);if(c)(m[c.id]=m[c.id]||[]).push(o);});S._ob=m;}
  return S._ob;
}
function expectedLen(){
  const set=parseInt(S.settings.cycleLen,10);
  if(set>=15&&set<=60)return set;
  const cs=cyclesSorted(),lens=[];
  for(let i=0;i<cs.length-1;i++)lens.push(D.diff(cs[i].start,cs[i+1].start));
  const last=lens.slice(-3);
  if(!last.length)return 30;
  return clamp(Math.round(sum(last)/last.length),20,45);
}
const budgetOf=(c,k)=>(c.budgets&&c.budgets[k.id]!=null)?+c.budgets[k.id]:(k.type==='fixe'?k.amount:0);
function livretBalances(){
  if(!S._bal){
    const m={};S.livrets.forEach(l=>m[l.id]=l.startBalance);
    S.operations.forEach(o=>{
      if(!o.livretId||!(o.livretId in m))return;
      if(o.type==='epargne'||o.type==='interet')m[o.livretId]+=o.amount;
      else if(o.type==='retrait')m[o.livretId]-=o.amount;
      else if(o.type==='revenu')m[o.livretId]+=(o.toSavings||0);
    });
    Object.keys(m).forEach(k=>m[k]=r2(m[k]));
    S._bal=m;
  }
  return S._bal;
}
function sumDep(ops,catId){return sum((ops||[]).filter(o=>o.type==='depense'&&o.catId===catId),o=>o.amount);}

function stats(c){
  const end=cycleEnd(c),closed=!!end,ops=(opsByCycle()[c.id]||[]);
  const total=closed?Math.max(1,D.diff(c.start,end)):expectedLen();
  const since=closed?total-1:Math.max(0,D.diff(c.start,S.today));
  const daysLeft=closed?0:Math.max(1,total-since);
  const frac=closed?1:clamp(since/total,0,1);
  const late=closed?0:Math.max(0,since+1-total);
  const keys=Object.keys(c.budgets||{});
  const list=S.categories.filter(k=>closed?(keys.indexOf(k.id)>=0||ops.some(o=>o.catId===k.id&&o.type==='depense')):true);
  const rows=list.map(k=>{
    const budget=budgetOf(c,k),spent=sumDep(ops,k.id);
    const pct=budget>0?spent/budget:(spent>0?2:0);
    let status='ok';
    if(spent>budget+0.005)status='over';
    else if(!closed&&budget>0&&pct>frac+0.15&&pct>0.3)status='warn';
    return {cat:k,budget,spent,pct,status,remaining:budget-spent};
  });
  const known=new Set(S.categories.map(k=>k.id));
  const orphan=sum(ops.filter(o=>o.type==='depense'&&!known.has(o.catId)),o=>o.amount);
  if(orphan>0)rows.push({cat:UNCAT,budget:0,spent:orphan,pct:2,status:'over',remaining:-orphan});
  const fixed=c.fixed||[];
  const P=sum(fixed,f=>+f.amount||0);
  const envBudget=sum(rows,r=>r.budget),envSpent=sum(rows,r=>r.spent);
  const savedGross=sum(ops.filter(o=>o.type==='epargne'),o=>o.amount);
  const withdrawn=sum(ops.filter(o=>o.type==='retrait'),o=>o.amount);
  const interest=sum(ops.filter(o=>o.type==='interet'),o=>o.amount);
  const bonus=sum(ops.filter(o=>o.type==='revenu'),o=>o.amount);
  const bonusSaved=sum(ops.filter(o=>o.type==='revenu'),o=>o.toSavings||0);
  const income=totalIncome(c);
  const savings=+c.savings||0;
  const planned=P+envBudget+savings;
  const available=envBudget-envSpent;
  const savedNet=savedGross-withdrawn;
  const avgDaily=closed?envSpent/total:envSpent/(since+1);
  return {c,closed,ops,total,since,daysLeft,frac,late,rows,fixed,P,envBudget,envSpent,savedGross,withdrawn,savedNet,interest,bonus,bonusSaved,savings,planned,
    income,available,avgDaily,perDay:available/daysLeft,unallocated:income-planned,leftover:income-P-envSpent-savedNet,spentTotal:P+envSpent};
}
function bilanWindow(st){return !st.closed&&st.daysLeft<=5&&st.since>=Math.floor(st.total*0.6);}

function insights(st){
  const out=[],c=st.c;
  if(bilanWindow(st))out.push({sev:-1,tone:'ok',title:'Bilan de fin de cycle',text:'Plus que '+st.daysLeft+' jour'+(st.daysLeft>1?'s':'')+' : vois comment utiliser ce que tu n\'as pas dépensé.',act:'bilan',label:'Voir ma proposition'});
  if(st.late>=3)out.push({sev:0,tone:'info',title:'Paie reçue ?',text:'Ton cycle dure depuis '+(st.since+1)+' jours (habituel : environ '+st.total+'). Si tu as été payé, démarre le suivant.',act:'newCycle',label:'J\'ai été payé'});
  if(st.income>0&&st.unallocated<-0.5)out.push({sev:0,tone:'bad',title:'Budget au-dessus de tes revenus',text:'Tes budgets dépassent tes revenus de '+eur(-st.unallocated)+'.',act:'recalc',label:'Recalculer depuis mes revenus'});
  st.rows.filter(r=>r.status==='over'&&r.cat.id).forEach(r=>out.push({sev:0,tone:'bad',title:r.cat.name+' dépassé',text:'Tu as dépassé ce budget de '+eur(r.spent-r.budget)+'.'}));
  if(!st.closed){
    st.rows.filter(r=>r.status==='warn').slice(0,2).forEach(r=>out.push({sev:1,tone:'warn',title:r.cat.name+' va vite',text:Math.round(r.pct*100)+' % du budget utilisé alors que '+Math.round(st.frac*100)+' % du cycle est écoulé.'}));
    if(st.frac>=0.25&&st.envBudget>0&&st.envSpent>0){
      const proj=st.avgDaily*st.total;
      if(proj>st.envBudget*1.05&&!st.rows.some(r=>r.status==='over'))out.push({sev:1,tone:'warn',title:'Rythme un peu élevé',text:'À ce rythme, tu finis le cycle autour de '+eurR(proj)+' pour '+eurR(st.envBudget)+' prévus.'});
      else if(st.frac>=0.5&&proj<st.envBudget*0.9)out.push({sev:3,tone:'ok',title:'Tu es en avance',text:'Environ '+eurR(st.envBudget-proj)+' pourraient finir en épargne si tu gardes ce rythme.'});
    }
    if(st.savings>0){
      if(st.savedNet+0.005>=st.savings)out.push({sev:3,tone:'ok',title:'Objectif d\'épargne atteint',text:eur(st.savedNet)+' mis de côté sur '+eur(st.savings)+' prévus.'});
      else out.push({sev:2,tone:'info',title:'Épargne à virer',text:'Il reste '+eur(st.savings-st.savedNet)+' à mettre de côté ce cycle.',act:'addSaving',label:'Enregistrer un virement'});
    }
    if(typeof unusualExpense==='function'){
      const u=unusualExpense(st);
      if(u){const k=catById(u.o.catId);out.push({sev:1,tone:'warn',title:'Dépense inhabituelle',text:'« '+u.o.label+' » ('+eurR(u.o.amount)+') est bien au-dessus de ta moyenne en '+(k?k.name:'cette catégorie')+' ('+eurR(u.avg)+').'});}
    }
    if(typeof detectRecurring==='function'){
      UI.detected=detectRecurring();
      UI.detected.slice(0,1).forEach((g,i)=>out.push({sev:2,tone:'info',title:'Un prélèvement caché ?',text:'« '+g.label+' » ('+eur(g.amount)+') revient à chaque cycle vers le '+g.day+'. Ajoute-le aux prélèvements pour qu\'il soit compté automatiquement.',act:'recDetect',arg:i,label:'Ajouter aux prélèvements'}));
    }
    if(st.income>0&&st.unallocated>st.income*0.05)out.push({sev:2,tone:'info',title:eurR(st.unallocated)+' non affectés',text:'Cet argent n\'a pas de rôle : l\'appli peut le répartir pour toi.',act:'recalc',label:'Recalculer'});
  }
  const lb=S.settings.lastBackup;
  if(S.operations.length>=10&&(!lb||D.diff(lb,S.today)>30))out.push({sev:2,tone:'info',title:'Pense à sauvegarder',text:lb?'Dernière sauvegarde il y a '+D.diff(lb,S.today)+' jours.':'Tu n\'as encore jamais exporté tes données.',act:'backup',label:'Faire une sauvegarde'});
  return out.sort((a,b)=>a.sev-b.sev);
}

/* Proposition : ajuste le budget selon ton historique */
function buildProposal(c){
  const income=totalIncome(c);
  if(!(income>0))return null;
  const profile=profileById(c.profileId)||{name:'Normal',rate:20};
  const ob=opsByCycle();
  const hist=cyclesSorted().filter(x=>x.id!==c.id&&cycleEnd(x)&&(ob[x.id]||[]).length>0).slice(-3);
  const cats=S.categories;
  const fixedAmounts={},weights={},why={};
  cats.filter(k=>k.type==='fixe').forEach(k=>{
    let to=k.amount,w='Montant conservé.';
    if(hist.length>=2){
      const avg=sum(hist,x=>sumDep(ob[x.id],k.id))/hist.length;
      if(avg>k.amount*1.1){to=r5(avg*1.05);w='Tu dépenses en moyenne '+eurR(avg)+' : budget relevé.';}
      else if(avg>0&&avg<k.amount*0.75){to=r5(avg*1.15);w='Tu dépenses en moyenne '+eurR(avg)+' : budget allégé.';}
    }
    fixedAmounts[k.id]=to;why[k.id]=w;
  });
  const vars=cats.filter(k=>k.type==='variable');
  if(hist.length>=1&&vars.length>1){
    const avgs=vars.map(k=>sum(hist,x=>sumDep(ob[x.id],k.id))/hist.length);
    const tot=sum(avgs);
    if(tot>0)vars.forEach((k,i)=>{weights[k.id]=Math.max(10,Math.round(avgs[i]/tot*100));why[k.id]='Réparti selon tes habitudes ('+Math.round(avgs[i]/tot*100)+' % de tes dépenses variables).';});
  }
  vars.forEach(k=>{if(weights[k.id]==null){weights[k.id]=k.weight;why[k.id]='Réparti selon ta part de '+k.weight+'.';}});
  let rate=profile.rate;
  if(c.rate!=null&&c.rate!==profile.rate)rate=c.rate;
  let note='';
  if(hist.length>=2){
    const lefts=hist.map(x=>Math.max(0,stats(x).available));
    const incs=hist.map(x=>totalIncome(x));
    const ratio=sum(incs)>0?sum(lefts)/sum(incs):0;
    if(ratio>=0.05){const add=Math.min(5,Math.round(ratio*100*0.5));if(add>0){rate=Math.min(60,rate+add);note='Tu ne dépenses pas tout ton budget : épargne relevée de '+add+' point'+(add>1?'s':'')+'.';}}
  }
  const catsOv=cats.map(k=>Object.assign({},k,{amount:fixedAmounts[k.id]!=null?fixedAmounts[k.id]:k.amount,weight:weights[k.id]!=null?weights[k.id]:k.weight}));
  const res=Backend.compute(income,rate,catsOv,c.fixed||[],null);
  const items=cats.map(k=>({catId:k.id,name:k.name,icon:k.icon,color:k.color,type:k.type,from:budgetOf(c,k),to:res.budgets[k.id]!=null?res.budgets[k.id]:0,why:why[k.id]}));
  const rateOut=income>0?res.savings/income*100:0;
  return {items,fixedAmounts,weights,rate,savings:res.savings,fromSavings:c.savings,rateOut,tight:res.tight,over:res.over,income,profile,P:sum(c.fixed||[],f=>f.amount),
    note,verdict:res.tight?'Budget très serré':(rateOut>=20?'Très bon taux d\'épargne':(rateOut>=10?'Taux d\'épargne correct':'Taux d\'épargne faible'))};
}

function savingsSeries(){
  const cs=cyclesSorted(),ob=opsByCycle();
  let cum=0;
  return cs.map(c=>{
    const ops=ob[c.id]||[];
    const net=sum(ops.filter(o=>o.type==='epargne'),o=>o.amount)-sum(ops.filter(o=>o.type==='retrait'),o=>o.amount);
    const interest=sum(ops.filter(o=>o.type==='interet'),o=>o.amount);
    const bonus=sum(ops.filter(o=>o.type==='revenu'),o=>o.toSavings||0);
    cum+=net+bonus;
    return {c,net,interest,bonus,cum};
  });
}

function cushion(){
  const cs=cyclesSorted(),ob=opsByCycle();
  const done=cs.filter(x=>cycleEnd(x)&&(ob[x.id]||[]).length>0).slice(-3);
  let monthly=0,basis='budget';
  if(done.length){monthly=sum(done,x=>stats(x).spentTotal)/done.length;basis='moyenne';}
  else if(cs.length){const st=stats(cs[cs.length-1]);monthly=st.P+st.envBudget;}
  const safe=sum(S.livrets.filter(l=>l.active&&(KINDS[l.kind]||KINDS.autre).safe),l=>livretBalances()[l.id]||0);
  return {monthly,basis,safe,min:monthly*3,max:monthly*6};
}

/* valeur d'un compte : valeur de marché saisie + versements faits depuis */
function livretValue(l){
  const b=livretBalances()[l.id]||0;
  if(l.marketValue==null)return b;
  let v=+l.marketValue;
  S.operations.forEach(o=>{
    if(o.livretId!==l.id||o.date<=l.valueDate)return;
    if(o.type==='epargne'||o.type==='interet')v+=o.amount;
    else if(o.type==='retrait')v-=o.amount;
    else if(o.type==='revenu')v+=(o.toSavings||0);
  });
  return r2(v);
}
function livretValueAt(l,date){
  const hist=(l.valueHistory||[]).filter(h=>h.date<=date);
  const last=hist.length?hist[hist.length-1]:null;
  let v=last?last.value:l.startBalance,from=last?last.date:'';
  S.operations.forEach(o=>{
    if(o.livretId!==l.id||o.date>date||(last&&o.date<=from))return;
    if(o.type==='epargne'||o.type==='interet')v+=o.amount;
    else if(o.type==='retrait')v-=o.amount;
    else if(o.type==='revenu')v+=(o.toSavings||0);
  });
  return v;
}
function investedAt(l,date){
  let v=l.startBalance;
  S.operations.forEach(o=>{
    if(o.livretId!==l.id||o.date>date)return;
    if(o.type==='epargne')v+=o.amount;
    else if(o.type==='retrait')v-=o.amount;
    else if(o.type==='revenu')v+=(o.toSavings||0);
  });
  return v;
}
const livretRoom=l=>l.ceiling>0?Math.max(0,l.ceiling-(livretBalances()[l.id]||0)):Infinity;
const canReceive=l=>l.active&&!l.paused&&livretRoom(l)>=1;

function goalProgress(g){
  const cur=g.livretId?(()=>{const l=livretById(g.livretId);return l?livretValue(l):0;})():sum(S.livrets.filter(l=>l.active),l=>livretValue(l));
  const pct=g.target>0?clamp(cur/g.target,0,1):0;
  let perCycle=null,daysLeft=null;
  if(g.date){
    daysLeft=D.diff(S.today,g.date);
    const cycles=Math.max(1,daysLeft/expectedLen());
    perCycle=cur>=g.target?0:Math.max(0,(g.target-cur)/cycles);
  }
  return {cur,pct,perCycle,daysLeft,done:cur>=g.target};
}

/* Répartition d'un montant entre les livrets :
   matelas d'abord (option), puis stratégie ; respecte les plafonds et les livrets en pause */
function allocate(amount,opts){
  opts=opts||{};
  const strat=strategyState();
  const cushionFirst=opts.cushionFirst!=null?opts.cushionFirst:strat.cushionFirst!==false;
  const left={};S.livrets.forEach(l=>left[l.id]=livretRoom(l));
  const cand=S.livrets.filter(canReceive);
  const skipped=[];
  const note=(name,why)=>{if(!skipped.some(x=>x.name===name&&x.why===why))skipped.push({name,why});};
  S.livrets.filter(l=>l.active).forEach(l=>{if(l.paused)note(l.name,'versements en pause');else if(livretRoom(l)<1)note(l.name,'plafond atteint');});
  const lines={};let R=Math.max(0,amount);
  const put=(l,amt,why)=>{
    amt=Math.min(amt,left[l.id]);
    if(!(amt>0.005))return 0;
    left[l.id]-=amt;
    const e=lines[l.id]||(lines[l.id]={livretId:l.id,amount:0,why:[]});
    e.amount+=amt;if(why&&e.why.indexOf(why)<0)e.why.push(why);
    return amt;
  };
  const safeSorted=()=>cand.filter(l=>(KINDS[l.kind]||KINDS.autre).safe).sort((a,b)=>(b.rate||0)-(a.rate||0));
  const putSafe=(amt,why)=>{let rest=amt;for(const l of safeSorted()){if(rest<0.005)break;rest-=put(l,rest,why);}return amt-rest;};
  const cu=cushion();
  const gap=Math.max(0,cu.min-cu.safe);
  let toCushion=0;
  if(cushionFirst&&R>=1&&gap>0){toCushion=putSafe(Math.min(R,gap),'Complète ton matelas de sécurité');R-=toCushion;}
  const rows=(strat.rows||[]).filter(r=>+r.pct>0),totPct=sum(rows,r=>+r.pct);
  const cushionDone=!cushionFirst||gap<=toCushion+0.5;
  if(R>=1&&rows.length&&totPct>0&&cushionDone){
    const cap=rows.map(r=>sum(cand.filter(l=>l.kind===r.kind),l=>left[l.id]));
    let w=rows.map(r=>+r.pct);
    if(opts.useGap){
      const tv=sum(S.livrets.filter(l=>l.active),l=>livretValue(l)),after=tv+R;
      const gaps=rows.map(r=>{
        const tgt=after*(+r.pct)/totPct;
        const act=sum(S.livrets.filter(l=>l.active&&l.kind===r.kind),l=>livretValue(l));
        return Math.max(0,tgt-act);
      });
      if(sum(gaps)>0.5)w=gaps;
    }
    const give=rows.map(()=>0);let rest=R,act=rows.map((r,i)=>i).filter(i=>cap[i]>=1&&w[i]>0);
    for(let it=0;it<12&&rest>=0.5&&act.length;it++){
      const W=sum(act,i=>w[i]);let spent=0;const next=[];
      act.forEach(i=>{
        const want=rest*w[i]/W,can=cap[i]-give[i],g=Math.min(want,can);
        give[i]+=g;spent+=g;if(can-g>=1)next.push(i);
      });
      rest-=spent;act=next;if(spent<0.01)break;
    }
    rows.forEach((r,i)=>{
      if(give[i]<=0)return;
      let g=give[i];
      cand.filter(l=>l.kind===r.kind).sort((a,b)=>left[b.id]-left[a.id]).forEach(l=>{if(g<0.005)return;g-=put(l,g,'Selon ta stratégie : '+r.label);});
    });
    R=rest;
    rows.forEach((r,i)=>{
      if(cap[i]>=1)return;
      const li=S.livrets.find(l=>l.active&&l.kind===r.kind);
      note(r.label,!li?'aucun compte '+(KINDS[r.kind]||KINDS.autre).label+' ouvert':(li.paused?'versements en pause':'plafond atteint'));
    });
  }
  if(R>=1){const p=putSafe(R,gap>0?'Complète ton matelas de sécurité':(rows.length?'Reste de la répartition':'Meilleur taux sans risque'));R-=p;}
  const arr=Object.keys(lines).map(k=>lines[k]);
  const total=sum(arr,l=>l.amount);
  const fl=arr.map(l=>Math.floor(l.amount));
  let rem=Math.round(total)-sum(fl);
  arr.map((l,i)=>[l.amount-Math.floor(l.amount),i]).sort((x,y)=>y[0]-x[0]).forEach(o=>{if(rem>0){fl[o[1]]++;rem--;}});
  arr.forEach((l,i)=>{l.amount=fl[i];l.why=l.why.join(' · ');});
  const out=arr.filter(l=>l.amount>0);
  return {lines:out,kept:Math.max(0,Math.max(0,amount)-sum(out,l=>l.amount)),skipped,gap,cu,hasStrategy:rows.length>0,cushionFirst};
}

/* Bilan de fin de cycle : que faire de l'argent non dépensé ? */
function buildBilan(c){
  const st=stats(c);
  const remainingDays=Math.max(0,st.total-(st.since+1));
  const projectedLeft=Math.max(0,st.available-st.avgDaily*remainingDays);
  const usable=Math.max(0,f5(projectedLeft*0.9));
  const reward=usable>=20?r5(usable*0.15):0;
  const al=allocate(usable-reward,{useGap:true});
  return {st,projectedLeft,usable,reward,lines:al.lines,gap:al.gap,cu:al.cu,hasStrategy:al.hasStrategy,skipped:al.skipped,
    kept:Math.max(0,usable-reward-sum(al.lines,l=>l.amount))};
}

function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r,a0,a1){
  if(a1-a0>=359.9)a1=a0+359.9;

/* petit anneau de progression (fraction restante ou accomplie) */
function ringSvg(frac,color,over,size,stroke){
  size=size||68;stroke=stroke||7;
  const r=(size-stroke)/2,c=2*Math.PI*r,f=clamp(frac,0,1);
  return '<svg viewBox="0 0 '+size+' '+size+'" aria-hidden="true"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(over?'rgba(255,59,48,.25)':'var(--track)')+'" stroke-width="'+stroke+'"/>'+
    (f>0.004?'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(over?'#FF3B30':color)+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+(c*f).toFixed(1)+' '+c.toFixed(1)+'"/>':'')+'</svg>';
}
function donutSegments(items,size,stroke,gap){
  const total=sum(items,i=>i.v);
  let s='<svg viewBox="0 0 '+size+' '+size+'" role="img" aria-hidden="true">';
  const R=(size-stroke)/2;
  if(!(total>0))return s+'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+R+'" fill="none" stroke="var(--track)" stroke-width="'+stroke+'"/></svg>';
  let a=0;const n=items.filter(i=>i.v>0).length;
  items.forEach(i=>{
    if(!(i.v>0))return;
    const span=i.v/total*360,g=n>1?gap:0;
    let a0=a+g/2,a1=a+span-g/2;if(a1-a0<0.8){a0=a;a1=a+span;}
    s+='<path d="'+arcPath(size/2,size/2,R,a0,a1)+'" fill="none" stroke="'+i.color+'" stroke-width="'+stroke+'"/>';
    a+=span;
  });
  return s+'</svg>';
}
function wheelSvg(st,animate){
  const cx=150,cy=150,R=124,Rt=96,gap=3.5;
  let s='<svg viewBox="0 0 300 300" role="img" aria-label="Répartition du budget disponible par enveloppe">';
  const rows=st.rows.filter(r=>r.cat.id&&r.budget>0);
  const total=sum(rows,r=>r.budget);
  if(!rows.length)s+='<circle cx="150" cy="150" r="'+R+'" class="arc" style="stroke:var(--track)"/>';
  else{
    let a=0;
    rows.forEach(r=>{
      const span=r.budget/total*360,g=rows.length>1?gap:0;
      let a0=a+g/2,a1=a+span-g/2;if(a1-a0<1){a0=a;a1=a+span;}
      a+=span;
      const over=r.status==='over';
      s+='<path d="'+arcPath(cx,cy,R,a0,a1)+'" class="arc" style="stroke:'+(over?'#FF3B30':r.cat.color)+';opacity:'+(over?.3:.2)+'"/>';
      const rem=clamp(1-(r.spent/r.budget),0,1);
      if(rem>0.004)s+='<path d="'+arcPath(cx,cy,R,a0,a0+(a1-a0)*rem)+'" class="arc'+(animate?' anim':'')+'" pathLength="100" style="stroke:'+r.cat.color+'"/>';
    });

  s+='<circle cx="150" cy="150" r="'+Rt+'" class="timering"/>';
  if(!st.closed&&st.frac>0.003){
    s+='<path d="'+arcPath(cx,cy,Rt,0,st.frac*360)+'" class="timearc"/>';

function applyTheme(){
  const t=S&&S.settings.theme?S.settings.theme:'light';
  document.documentElement.setAttribute('data-theme',t);
  const dark=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',dark?'#1C1C1E':'#F2F2F7');
  document.body.classList.toggle('hide',!!(S&&S.settings.hide==='1'));
  try{localStorage.setItem('monbudget.theme',t);}catch(e){}
}
function render(){
  if(!S)return;
  applyTheme();
  if(S.settings.setupDone!=='true'){renderSetup();return;}
  $('#tabbar').hidden=false;
  $('#fab').hidden=!S.cycles.length||UI.tab==='learn'||UI.tab==='overview';
  $('#tabs').innerHTML=TABS.map(t=>'<button class="tab" data-act="tab" data-id="'+t[0]+'"'+(UI.tab===t[0]?' aria-current="page"':'')+'>'+icon(t[2])+'<span>'+t[1]+'</span></button>').join('');
  const titles={home:'Accueil',budget:'Budget',hist:'Historique',save:'Épargne',learn:'Bourse',overview:'Vue globale'};
  let sub='';const c=currentCycle();
  if(UI.tab==='home'&&c){const st=stats(c);sub='Cycle du '+dShort(c.start)+' · jour '+(st.since+1)+' sur ~'+st.total;}
  $('#top').innerHTML='<div style="min-width:0"><h1>'+titles[UI.tab]+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div><div class="btns"><button class="iconbtn" data-act="assistant" aria-label="Assistant">'+icon('spark')+'</button><button class="iconbtn" data-act="overview" aria-label="Vue globale">'+icon('dash')+'</button><button class="iconbtn" data-act="settings" aria-label="Réglages">'+icon('gear')+'</button></div>';
  let html='';
  if(UI.tab==='home')html=viewHome();
  else if(UI.tab==='budget')html=viewBudget();
  else if(UI.tab==='hist')html=viewHistory();
  else if(UI.tab==='save')html=viewSavings();
  else if(UI.tab==='overview')html=viewOverview();
  else html=viewLearn();
  $('#view').innerHTML=html;
  if(UI.tab==='home')UI.animated=true;
  afterRender();
}

/* ---------- Épargne ---------- */
function savingsChart(series){
  const data=series.slice(-10);
  if(!data.length)return '';
  const W=340,H=170,pl=10,pr=10,pt=22,pb=26;
  const vals=data.map(s=>s.net+s.bonus);
  const maxPos=Math.max(1,...vals.map(v=>Math.max(0,v))),maxNeg=Math.max(0,...vals.map(v=>Math.max(0,-v)));
  const ph=H-pt-pb,y0=pt+ph*maxPos/(maxPos+maxNeg);
  const sc=ph/(maxPos+maxNeg);
  const n=data.length,step=(W-pl-pr)/n,bw=Math.min(34,step*.58);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Épargne par cycle"><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y0+'" y2="'+y0+'" stroke="var(--line)"/>';
  data.forEach((d,i)=>{
    const v=vals[i],x=pl+step*i+(step-bw)/2,hgt=Math.abs(v)*sc,y=v>=0?y0-hgt:y0;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(hgt,v===0?0:1.5).toFixed(1)+'" rx="6" fill="'+(v>=0?'#34C759':'#FF3B30')+'"/>';
    if(v!==0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(v>=0?y-5:y+hgt+11).toFixed(1)+'" text-anchor="middle">'+eurR(v)+'</text>';
    if(n<=6||i%2===(n-1)%2)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+dShort(d.c.start)+'</text>';
  });
  return s+'</svg>';
}

  let h='<section class="panel pad"><div class="small muted">Total épargné</div><div style="font:700 42px/1.1 var(--font);letter-spacing:-.035em" class="num">'+eur(total)+'</div>'+

    (total>0?'<div style="margin-top:14px">'+donutBar(act.filter(l=>livretValue(l)>0).map(l=>({color:l.color,v:livretValue(l)})))+'</div>':'')+'</section>';

const val=id=>{const e=document.getElementById(id);return e?e.value:'';};
function openSheet(html,opts){
  opts=opts||{};
  const root=$('#sheetRoot');
  if(root.classList.contains('open')&&opts.key&&UI.sheetKey===opts.key){
    const sh=$('.sheet',root),top=sh.scrollTop;
    sh.innerHTML='<div class="grab"></div>'+html;sh.scrollTop=top;
  }else{
    root.innerHTML='<div class="backdrop" data-act="closeSheet"></div><div class="sheet'+(opts.tall?' tall':'')+'" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';
    root.classList.add('open');
    document.body.style.overflow='hidden';
    if(!UI.sheetPushed){try{history.pushState({sheet:1},'');UI.sheetPushed=true;}catch(e){}}
  }
  UI.sheetKey=opts.key||null;
  if(opts.focus){const f=$(opts.focus,root);if(f)setTimeout(()=>{try{f.focus();}catch(e){}},60);}
  if(opts.mount)opts.mount(root);
}
function closeSheet(fromPop){
  const root=$('#sheetRoot');
  root.classList.remove('open');root.innerHTML='';
  document.body.style.overflow='';
  UI.sheetKey=null;
  if(UI.sheetPushed){UI.sheetPushed=false;if(!fromPop){try{UI.ignorePop=(UI.ignorePop||0)+1;history.back();}catch(e){UI.ignorePop=Math.max(0,(UI.ignorePop||1)-1);}}}
}

function readAdd(){
  if(!opDraft)return;

      '<input type="range" id="f_tos" data-act="opTos" min="0" max="100" step="5" value="'+Math.round(d.sharePct)+'" aria-label="Part épargnée en pourcentage" style="margin-top:6px">'+

async function saveOp(overrides){
  if(opSaving)return;
  readAdd();
  const d=Object.assign({},opDraft,overrides||{}),amt=parseNum(d.amount);
  if(!isFinite(amt)||amt===0){toast('Saisis d\'abord le montant.',true);const f=$('#f_amount');if(f)f.focus();return;}
  if(d.type==='epargne'||d.type==='retrait'||d.type==='interet'){if(!d.livretId){toast('Choisis un livret.',true);return;}}
  opSaving=true;
  try{
    const wasNew=!d.id;
    const payload={id:d.id||undefined,type:d.type,date:d.date,catId:d.type==='depense'?d.catId:'',livretId:d.livretId,amount:amt,label:d.label};
    if(d.type==='revenu'){payload.toSavings=tosAmount();if(!payload.toSavings)payload.livretId='';}
    const r=await act('saveOperation',payload,null);
    if(r){
      closeSheet();
      let msg='Opération enregistrée';
      if(d.type==='depense'){
        UI.lastCat=d.catId;
        const c=currentCycle(),st=c?stats(c):null,row=st?st.rows.find(x=>x.cat.id===d.catId):null,k=catById(d.catId);
        msg=row&&k?esc2(k.name)+' : reste '+eurR(row.remaining):'Dépense enregistrée';
      }else if(d.type==='epargne')msg='Épargne enregistrée';
      else if(d.type==='revenu'){const c=currentCycle();msg=payload.toSavings>0?'Rentrée enregistrée':'Rentrée ajoutée à ton budget';}
      toast(wasNew?msg:'Modifié',false,true);
    }
  }finally{opSaving=false;}
}
