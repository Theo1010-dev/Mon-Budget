/* ---------- Profils ---------- */
function openPickProfile(){
  const c=currentCycle();if(!c)return;
  openSheet('<h3>Profil du mois</h3><p class="lead">Un profil règle ton taux d\'épargne : plus il est élevé, moins il reste pour tes enveloppes variables.</p><div class="list" style="margin-top:14px">'+
    S.profiles.map(p=>'<button class="row" data-act="setProfile" data-id="'+esc(p.id)+'"><span class="badge" style="background:var(--surface2)">'+esc(p.icon)+'</span><div class="grow"><div class="t">'+esc(p.name)+(p.id===c.profileId?' ✓':'')+'</div><div class="s">Épargne '+fmtPct(p.rate)+' de tes revenus</div></div></button>').join('')+'</div>'+
    '<div class="sheet-actions"><button class="btn ghost" data-act="manageProfiles">Gérer les profils</button></div>',{key:'pickprofile'});
}
let profDraft=null;
function openManageProfiles(){
  openSheet('<h3>Profils de dépense</h3><p class="lead">Un profil = un taux d\'épargne cible (Vacances, Restreint…).</p><div class="list" style="margin-top:14px">'+
    S.profiles.map(p=>'<button class="row" data-act="editProfile" data-id="'+esc(p.id)+'"><span class="badge" style="background:var(--surface2)">'+esc(p.icon)+'</span><div class="grow"><div class="t">'+esc(p.name)+'</div><div class="s">Épargne '+fmtPct(p.rate)+'</div></div><span class="chev">›</span></button>').join('')+
    '<button class="rowadd" data-act="newProfile">＋ Ajouter un profil</button></div>',{key:'manageprofiles'});
}
function openProfileEdit(id){
  const p=id?profileById(id):null;
  profDraft=p?Object.assign({},p):{id:'',name:'',icon:'✨',rate:15};
  drawProfileEdit();
}
function readProf(){const n=$('#f_pname');if(n)profDraft.name=n.value;const r=$('#f_prate');if(r)profDraft.rate=r.value;}
function drawProfileEdit(){
  const d=profDraft,isNew=!d.id,em=['⚖️','🌴','🧊','🔥','🎓','🛍️','✈️','🏠','🎄','🚀'];
  openSheet('<h3>'+(isNew?'Nouveau profil':'Modifier le profil')+'</h3>'+
    '<div class="field"><label for="f_pname">Nom</label><input id="f_pname" maxlength="24" value="'+esc(d.name)+'" placeholder="Ex. Week-end entre amis"></div>'+
    '<div class="lbl2">Icône</div><div class="emojis" style="margin-top:8px">'+em.map(e=>'<button data-act="profIcon" data-id="'+e+'" aria-pressed="'+(d.icon===e)+'">'+e+'</button>').join('')+'</div>'+
    '<div class="field"><label for="f_prate">Épargne cible (% de tes revenus)</label><input id="f_prate" inputmode="decimal" value="'+esc(fnum(d.rate))+'"></div>'+
    '<div class="sheet-actions">'+(isNew?'<button class="btn ghost" data-act="manageProfiles">Retour</button>':'<button class="btn danger fit" data-act="profDelete">Supprimer</button>')+'<button class="btn" data-act="profSave">Enregistrer</button></div>',{key:'profedit',focus:isNew?'#f_pname':null});
}
async function saveProf(){
  readProf();
  const d=profDraft,rate=parseNum(d.rate);
  if(!d.name.trim()){toast('Donne un nom au profil.',true);return;}
  if(!isFinite(rate)){toast('Taux invalide.',true);return;}
  const r=await act('saveProfile',{id:d.id||undefined,name:d.name,icon:d.icon,rate},'Profil enregistré');
  if(r)openManageProfiles();
}

/* ---------- Proposition intelligente ---------- */
function openProposal(){
  const c=currentCycle();if(!c)return;
  const pr=buildProposal(c);
  if(!pr){openSheet('<h3>Proposition</h3><p class="lead">Indique d\'abord tes revenus pour ce cycle : la proposition part de là.</p><div class="sheet-actions"><button class="btn" data-act="editCycle">Modifier le cycle</button></div>',{key:'proposal'});return;}
  const changed=pr.items.filter(i=>Math.abs(i.to-i.from)>=1).length>0||Math.abs(pr.savings-pr.fromSavings)>=1;
  let h='<h3>Proposition pour ce cycle</h3><p class="lead">Profil '+esc(pr.profile.name)+', revenus de '+eur(pr.income)+'.</p>'+
    '<div class="panel pad" style="margin:14px 0"><div class="small muted">'+esc(pr.verdict)+'</div><div style="font:700 32px var(--font);letter-spacing:-.03em" class="num">'+eur(pr.savings)+' <span class="muted" style="font:500 15px var(--font)">à épargner · '+fmtPct(pr.rateOut)+'</span></div>'+(pr.note?'<div class="small muted" style="margin-top:6px">'+esc(pr.note)+'</div>':'')+'</div>'+
    (pr.tight?'<div class="callout warn"><b>Budget serré</b>Tes charges laissent peu de marge. L\'épargne est réduite ; pense à alléger une enveloppe.</div>':'')+
    '<div class="list">'+pr.items.map(i=>{
      const dlt=i.to-i.from;
      return '<div class="row" style="align-items:flex-start">'+badge({color:i.color,icon:i.icon})+'<div class="grow"><div class="t" style="white-space:normal">'+esc(i.name)+'</div><div class="s">'+esc(i.why||'')+'</div></div>'+
        '<div style="text-align:right"><div class="amt">'+eurR(i.to)+'</div><div class="small muted num">'+(Math.abs(dlt)<1?'inchangé':(dlt>0?'+':'−')+eurR(Math.abs(dlt)))+'</div></div></div>';
    }).join('')+'</div>'+
    '<p class="help">Prélèvements conservés : '+eurR(pr.P)+'. Les enveloppes variables se partagent ce qui reste.</p>'+
    '<div class="sheet-actions"><button class="btn ghost" data-act="closeSheet">'+(changed?'Garder mes budgets':'Fermer')+'</button>'+(changed?'<button class="btn" id="pr_apply">Appliquer</button>':'')+'</div>';
  openSheet(h,{key:'proposal',tall:pr.items.length>5});
  const b=$('#pr_apply');
  if(b)b.onclick=async()=>{
    const r=await act('applyProposal',{cycleId:c.id,fixedAmounts:pr.fixedAmounts,weights:pr.weights,rate:pr.rate},'Budgets mis à jour',true);
    if(r)closeSheet();
  };
}

/* ---------- Bilan de fin de cycle ---------- */
function openBilan(){
  const c=currentCycle();if(!c)return;
  const b=buildBilan(c),st=b.st;
  let h='<h3>Bilan de fin de cycle</h3><p class="lead">'+(st.daysLeft<=1?'Dernier jour':'Encore '+st.daysLeft+' jours')+' avant la prochaine paie.</p>';
  if(b.usable<5){
    h+='<div class="panel pad" style="margin:14px 0"><div style="font:700 20px var(--font)">Pas d\'économie prévue</div><p class="muted" style="margin:6px 0 0">À ton rythme actuel ('+eurR(st.avgDaily)+' par jour), tu dépenses presque tout ton budget. Rien à répartir ce cycle : c\'est le signe que ton budget est bien ajusté.</p></div>';
    if(st.savedNet<st.savings)h+='<div class="callout"><b>Épargne du cycle</b>Il te reste '+eur(st.savings-st.savedNet)+' à virer pour atteindre ton objectif.</div>';
    h+='<div class="sheet-actions"><button class="btn" data-act="closeSheet">Fermer</button></div>';
    openSheet(h,{key:'bilan'});return;
  }
  const items=b.lines.map(l=>{const lv=livretById(l.livretId);return {color:lv?lv.color:'#34C759',v:l.amount};});
  if(b.reward>0)items.push({color:'#FF9500',v:b.reward});
  if(b.kept>0)items.push({color:'rgba(142,142,147,.5)',v:b.kept});
  h+='<div class="panel pad" style="margin:14px 0"><div class="small muted">Argent probablement non dépensé</div><div style="font:700 36px var(--font);letter-spacing:-.03em" class="num">≈ '+eurR(b.usable)+'</div>'+
    '<div class="small muted">sur '+eurR(Math.max(0,st.available))+' encore disponibles (marge de sécurité de 10 % déduite)</div>'+
    '<div class="donutwrap" style="width:170px;margin-top:12px">'+donutSegments(items,170,20,3)+'<div class="c" style="padding:0 34px"><b style="font-size:20px">'+eurR(b.usable)+'</b></div></div></div>';
  h+='<div class="lbl2">Ma proposition</div><div class="list" style="margin-top:8px">'+
    b.lines.map(l=>{const lv=livretById(l.livretId);return '<div class="row" style="align-items:flex-start"><span class="badge" style="background:'+(lv?lv.color:'#34C759')+'26;color:'+(lv?lv.color:'#34C759')+';font-weight:700;font-size:12px">'+esc(lv?(KINDS[lv.kind]||KINDS.autre).label.slice(0,3):'🌱')+'</span><div class="grow"><div class="t">'+esc(lv?lv.name:'Livret')+'</div><div class="s" style="white-space:normal">'+esc(l.why)+'</div></div><div class="amt pos">+'+eurR(l.amount)+'</div></div>';}).join('')+
    (b.reward>0?'<div class="row" style="align-items:flex-start"><span class="badge" style="background:rgba(255,149,0,.18)">🎈</span><div class="grow"><div class="t">Pour te faire plaisir</div><div class="s" style="white-space:normal">Une petite part sans culpabilité : c\'est ce qui fait tenir un budget dans la durée.</div></div><div class="amt">'+eurR(b.reward)+'</div></div>':'')+
    '</div>';
  if(!b.lines.length)h+='<div class="callout warn"><b>Aucun livret disponible</b>Ajoute un livret dans l\'onglet Épargne pour recevoir cet argent.</div>';
  if(b.skipped&&b.skipped.length)h+='<div class="callout"><b>Non alimentés</b>'+b.skipped.map(x=>esc(x.name)+' : '+esc(x.why)).join('<br>')+'</div>';
  if(b.kept>=5)h+='<p class="help">'+eurR(b.kept)+' ne peuvent pas être placés (plafonds atteints ou livrets en pause) : ils restent sur ton compte.</p>';
  if(b.gap>0)h+='<p class="help">Ton matelas de sécurité vise 3 mois de dépenses ('+eurR(b.cu.min)+') : il te manque '+eurR(b.gap)+'.</p>';
  else if(!b.hasStrategy)h+='<p class="help">Écris ta stratégie dans Bourse › Ma stratégie : la proposition répartira alors vers ton PEA, ton assurance-vie… selon tes choix.</p>';
  h+='<p class="help">Ces virements sont à faire sur ta banque : l\'appli les enregistre pour suivre ton épargne.</p>'+
    '<div class="sheet-actions"><button class="btn ghost" data-act="closeSheet">Plus tard</button>'+(b.lines.length?'<button class="btn" id="bl_apply">Enregistrer ces virements</button>':'')+'</div>';
  openSheet(h,{key:'bilan',tall:true});
  const a=$('#bl_apply');
  if(a)a.onclick=async()=>{
    const r=await act('applyBilan',{date:S.today,lines:b.lines.map(l=>({livretId:l.livretId,amount:l.amount,label:'Bilan de fin de cycle'}))},'Virements enregistrés',true);
    if(r)closeSheet();
  };
}
function openInsights(){
  const c=currentCycle();if(!c)return;
  const ins=insights(stats(c));
  openSheet('<h3>Conseils</h3><div class="panel pad" style="margin-top:12px;padding-top:2px;padding-bottom:2px">'+
    (ins.length?ins.map(i=>'<div class="row nobadge" style="align-items:flex-start;padding:12px 0"><span class="tdot '+i.tone+'"></span><div class="grow"><div class="t" style="white-space:normal">'+esc(i.title)+'</div><div class="s" style="white-space:normal">'+esc(i.text)+'</div>'+(i.act?'<button class="btn sm ghost" style="margin-top:8px" data-act="'+i.act+'"'+(i.arg!=null?' data-id="'+i.arg+'"':'')+'>'+esc(i.label)+'</button>':'')+'</div></div>').join(''):'<div class="row nobadge muted">Tout va bien, rien à signaler.</div>')+'</div>',{key:'insights'});
}

/* ---------- Feuille d'une enveloppe (jauge utilisable) ---------- */
function openEnvSheet(catId){
  const c=currentCycle(),k=catById(catId);if(!c||!k)return;
  const st=stats(c),r=st.rows.find(x=>x.cat.id===catId);if(!r)return;
  const over=r.status==='over',rem=r.budget>0?clamp(1-r.spent/r.budget,0,1):0;
  const ops=(st.ops||[]).filter(o=>o.type==='depense'&&o.catId===catId).sort((a,b)=>a.date<b.date?1:-1).slice(0,5);
  openSheet('<div style="text-align:center"><div class="ring" style="width:116px;height:116px;margin:4px auto 0">'+ringSvg(rem,k.color,over,116,11)+'<span class="em" style="font-size:42px">'+esc(k.icon)+'</span></div>'+
    '<h3 style="margin-top:10px">'+esc(k.name)+'</h3><div style="font:700 34px var(--font);letter-spacing:-.03em" class="num'+(over?'':'')+'" '+(over?'style="color:var(--neg)"':'')+'>'+(over?'−'+eur(r.spent-r.budget):eur(r.remaining))+'</div>'+
    '<div class="small muted">'+(over?'dépassé':'restant')+' · '+eur(r.spent)+' dépensés sur '+eur(r.budget)+(!st.closed&&r.remaining>0?' · ≈ '+eurR(r.remaining/st.daysLeft)+' par jour':'')+'</div></div>'+
    (ops.length?'<div class="lbl2" style="margin-top:18px">Dernières dépenses</div><div class="list" style="margin-top:8px">'+ops.map(opRow).join('')+'</div>':'')+
    '<div class="sheet-actions"><button class="btn ghost" data-act="editBudget" data-id="'+esc(catId)+'">Budget</button><button class="btn" data-act="addTo" data-id="'+esc(catId)+'">＋ Dépense</button></div>',{key:'env'});
}
function openEditBudget(catId){
  const c=currentCycle(),k=catById(catId);if(!c||!k)return;
  const st=stats(c),r=st.rows.find(x=>x.cat.id===catId);
  const ob=opsByCycle();
  const recent=cyclesSorted().filter(x=>x.id!==c.id&&cycleEnd(x)&&(ob[x.id]||[]).length>0).slice(-3);
  const avg=recent.length?sum(recent,x=>sumDep(ob[x.id],k.id))/recent.length:null;
  openSheet('<h3>'+esc(k.icon)+' '+esc(k.name)+'</h3><p class="lead">'+(k.type==='fixe'?'Montant fixe : il devient aussi la base des prochains cycles.':'Enveloppe variable : son montant se calcule depuis tes revenus. Le modifier ici le fixe à la main pour ce cycle.')+'</p>'+
    '<div class="field"><input id="f_bud" class="amount" inputmode="decimal" value="'+esc(fnum(r?r.budget:0))+'" aria-label="Budget en euros"></div>'+
    '<div class="chips" style="justify-content:center"><button class="chip" data-act="bump" data-id="-20">−20</button><button class="chip" data-act="bump" data-id="-10">−10</button><button class="chip" data-act="bump" data-id="10">+10</button><button class="chip" data-act="bump" data-id="20">+20</button></div>'+
    '<div style="margin-top:14px">'+(r?'<div class="kv"><span>Déjà dépensé</span><b>'+eur(r.spent)+'</b></div>':'')+(avg!=null?'<div class="kv"><span>Moyenne des '+recent.length+' derniers cycles</span><b>'+eur(avg)+'</b></div>':'')+'</div>'+
    '<div class="sheet-actions"><button class="btn ghost" data-act="editCat" data-id="'+esc(k.id)+'">Modifier l\'enveloppe</button><button class="btn" id="eb_save">Enregistrer</button></div>',{key:'editbudget',focus:'#f_bud'});
  $('#eb_save').onclick=async()=>{
    const v=parseNum(val('f_bud'));
    if(!isFinite(v)||v<0){toast('Montant invalide.',true);return;}
    const m={};m[catId]=v;
    const res=await act('setBudgets',{cycleId:c.id,budgets:m},'Budget enregistré',true);
    if(res)closeSheet();
  };
}

/* ---------- Enveloppes (catégories) ---------- */
let catDraft=null;
function openCatEdit(id){
  const k=id?catById(id):null;
  catDraft=k?Object.assign({},k):{id:'',name:'',icon:'🏷️',type:'variable',amount:'',weight:50,color:PALETTE[S.categories.length%PALETTE.length]};
  drawCatEdit();
}
function readCat(){
  const n=$('#f_name');if(n)catDraft.name=n.value;
  const a=$('#f_camt');if(a)catDraft.amount=a.value;
  const w=$('#f_cw');if(w)catDraft.weight=w.value;
  const ic=$('#f_icon');if(ic&&ic.value)catDraft.icon=ic.value;
}
function drawCatEdit(){
  const d=catDraft,isNew=!d.id;
  openSheet('<h3>'+(isNew?'Nouvelle enveloppe':'Modifier l\'enveloppe')+'</h3>'+
    '<div class="field"><label for="f_name">Nom</label><input id="f_name" maxlength="30" value="'+esc(d.name)+'" placeholder="Ex. Sport"></div>'+
    '<div class="lbl2">Icône</div><div class="emojis" style="margin-top:8px">'+EMOJIS.map(e=>'<button data-act="catIcon" data-id="'+e+'" aria-pressed="'+(d.icon===e)+'" aria-label="Icône '+e+'">'+e+'</button>').join('')+'</div>'+
    '<div class="field"><label for="f_icon">Ou tape ton propre emoji</label><input id="f_icon" maxlength="8" placeholder="'+esc(d.icon)+'"></div>'+
    '<div class="lbl2">Type</div><div class="seg" style="margin-top:8px"><button data-act="catType" data-id="fixe" aria-pressed="'+(d.type==='fixe')+'">Montant fixe</button><button data-act="catType" data-id="variable" aria-pressed="'+(d.type==='variable')+'">Variable</button></div>'+
    '<p class="help">'+(d.type==='fixe'?'Même montant à chaque cycle (ex. courses).':'Elle se partage ce qui reste de tes revenus et s\'adapte chaque mois (ex. essence, fun).')+'</p>'+
    (d.type==='fixe'?'<div class="field"><label for="f_camt">Budget par cycle (€)</label><input id="f_camt" inputmode="decimal" value="'+esc(d.amount===''?'':fnum(d.amount))+'" placeholder="0"></div>'
      :'<div class="field"><label for="f_cw">Part du reste : <b id="f_cwv">'+Math.round(d.weight||50)+'</b></label><input id="f_cw" type="range" min="5" max="100" step="5" value="'+Math.min(100,Math.max(5,Math.round(d.weight||50)))+'" data-act="catW"></div>')+
    '<div class="lbl2" style="margin-top:6px">Couleur</div><div class="swatches" style="margin-top:8px">'+PALETTE.map(c=>'<button class="sw" data-act="catColor" data-id="'+c+'" style="background:'+c+'" aria-pressed="'+(d.color===c)+'" aria-label="Couleur"></button>').join('')+'</div>'+
    '<div class="sheet-actions">'+(isNew?'<button class="btn ghost" data-act="closeSheet">Annuler</button>':'<button class="btn danger fit" data-act="catDelete">Supprimer</button>')+'<button class="btn" data-act="catSave">Enregistrer</button></div>',{key:'catedit',focus:isNew?'#f_name':null});
}
async function saveCat(){
  readCat();
  const d=catDraft;
  if(!d.name.trim()){toast('Donne un nom à l\'enveloppe.',true);return;}
  const amt=parseNum(d.amount===''?'0':d.amount);
  if(d.type==='fixe'&&(!isFinite(amt)||amt<0)){toast('Montant invalide.',true);return;}
  const r=await act('saveCategory',{id:d.id||undefined,name:d.name,icon:d.icon,type:d.type,amount:d.type==='fixe'?amt:0,weight:d.type==='variable'?parseNum(d.weight)||50:0,color:d.color},'Enveloppe enregistrée',true);
  if(r)closeSheet();
}

/* ---------- Prélèvements automatiques ---------- */
let recDraft=null;
function openRecEdit(id){
  const f=id?(S.recurring.find(r=>r.id===id)||currentFixed(id)):null;
  recDraft=f?{id:f.id,name:f.name,icon:f.icon,amount:fnum(f.amount),day:f.day||''}:{id:'',name:'',icon:'🔁',amount:'',day:''};
  drawRecEdit();
}
function currentFixed(id){const c=currentCycle();return c?(c.fixed||[]).find(f=>f.id===id):null;}
function readRec(){const n=$('#f_rname');if(n)recDraft.name=n.value;const a=$('#f_ramt');if(a)recDraft.amount=a.value;const d=$('#f_rday');if(d)recDraft.day=d.value;}
function drawRecEdit(){
  const d=recDraft,isNew=!d.id;
  openSheet('<h3>'+(isNew?'Nouveau prélèvement':'Modifier le prélèvement')+'</h3>'+
    (isNew?'<div class="lbl2" style="margin-top:10px">Raccourcis</div><div class="chips" style="margin-top:8px">'+DEBIT_PRESETS.map(p=>'<button class="chip" data-act="recPreset" data-id="'+esc(p[0])+'|'+esc(p[1])+'">'+esc(p[1])+' '+esc(p[0])+'</button>').join('')+'</div>':'')+
    '<div class="field"><label for="f_rname">Nom</label><input id="f_rname" maxlength="40" value="'+esc(d.name)+'" placeholder="Ex. Loyer, Netflix…"></div>'+
    '<div class="two"><div class="field"><label for="f_ramt">Montant (€)</label><input id="f_ramt" inputmode="decimal" value="'+esc(d.amount)+'" placeholder="0"></div>'+
    '<div class="field"><label for="f_rday">Jour du mois</label><input id="f_rday" inputmode="numeric" value="'+esc(d.day)+'" placeholder="facultatif"></div></div>'+
    '<p class="help">Compté automatiquement à chaque cycle, sans rien saisir. Quand il change, tes enveloppes variables s\'ajustent.</p>'+
    '<div class="sheet-actions">'+(isNew?'<button class="btn ghost" data-act="closeSheet">Annuler</button>':'<button class="btn danger fit" data-act="recDelete">Supprimer</button>')+'<button class="btn" data-act="recSave">Enregistrer</button></div>',{key:'recedit',focus:isNew?'#f_rname':null});
}
async function saveRec(){
  readRec();
  const d=recDraft,amt=parseNum(d.amount);
  if(!d.name.trim()){toast('Donne un nom au prélèvement.',true);return;}
  if(!isFinite(amt)||amt<0){toast('Indique le montant.',true);return;}
  const r=await act('saveRecurring',{id:d.id||undefined,name:d.name,icon:d.icon,amount:amt,day:d.day},'Prélèvement enregistré',true);
  if(r)closeSheet();
}

async function setupStep2(){
  /* suggestions chiffrées à partir des revenus, seulement si l'utilisateur n'a rien changé */
  const c=currentCycle();
  if(c&&!UI.suggested){
    UI.suggested=true;
    const inc=totalIncome(c);
    const seedC=S.categories.find(k=>k.id==='cat_courses'),seedI=S.categories.find(k=>k.id==='cat_imprevus');
    if(inc>0&&seedC&&seedC.amount===150){await act('saveCategory',{id:seedC.id,name:seedC.name,icon:seedC.icon,type:'fixe',amount:Math.max(20,r5(inc*0.15)),color:seedC.color});}
    if(inc>0&&seedI&&seedI.amount===40){const k=S.categories.find(x=>x.id==='cat_imprevus');await act('saveCategory',{id:k.id,name:k.name,icon:k.icon,type:'fixe',amount:Math.max(10,r5(inc*0.04)),color:k.color});}
  }
  UI.setupStep=3;render();
}

  busy(true);

   11. IMPORT D'UN RELEVÉ BANCAIRE (CSV) — saisie en un coup
   ===================================================================== */
let csvRows=[];
const nrm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function parseCsv(text){
  text=String(text).replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const delim=[';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(c=>c.trim()!==''))rows.push(row);row=[];}
    else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);if(row.some(c=>c.trim()!==''))rows.push(row);}
  return rows;
}
function parseDateAny(s){
  s=String(s||'').trim();
  let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');}
  return '';
}
function detectCols(header){
  const h=header.map(nrm);
  let date=h.findIndex(x=>/date/.test(x)&&/op/.test(x));
  if(date<0)date=h.findIndex(x=>/date/.test(x)&&!/valeur/.test(x));
  if(date<0)date=h.findIndex(x=>/date/.test(x));
  const label=h.findIndex((x,i)=>i!==date&&/libell|descr|motif|intitul|label|detail|beneficiaire|tiers/.test(x));
  const amount=h.findIndex(x=>/^montant|amount|^valeur$/.test(x));
  const debit=h.findIndex(x=>/debit/.test(x)),credit=h.findIndex(x=>/credit/.test(x));
  return {date,label,amount,debit,credit,ok:date>=0&&label>=0&&(amount>=0||debit>=0||credit>=0)};
}
const STOP=new Set(['cb','carte','paiement','achat','prlv','prelevement','vir','virement','sepa','du','de','la','le','les','des','x','retrait','dab','fr','sa','sas']);
function labelKey(label){
  return nrm(label).replace(/\d+/g,' ').replace(/[^a-z ]/g,' ').split(/\s+/).filter(w=>w.length>1&&!STOP.has(w)).slice(0,2).join(' ');
}
const HINTS=[
  [/essence|carbur|gasoil|auto/,/total|esso|shell|carburant|station|avia|bp |\bbp\b|leclerc station|intermarche station/],
  [/course|aliment|supermarch|nourriture/,/leclerc|carrefour|intermarche|lidl|aldi|auchan|super u|casino|monoprix|franprix|picard|biocoop|courses|u express/],
  [/fun|sortie|loisir|resto|plaisir|restaurant/,/restaurant|resto|mcdo|mc do|burger|kebab|pizza|cinema|netflix|spotify|steam|playstation|fnac|bar |cafe|deliveroo|uber eats|ubereats/]
];
function suggestCat(label,rules){
  const key=labelKey(label);
  if(key&&rules[key]&&catById(rules[key]))return rules[key];
  const n=nrm(label);
  for(const h of HINTS){
    if(h[1].test(n)){const k=S.categories.find(c=>h[0].test(nrm(c.name)));if(k)return k.id;}
  }
  return '';
}
function openCsvReview(text){
  let rules={};try{rules=JSON.parse(S.settings.catRules||'{}');}catch(e){rules={};}
  const rows=parseCsv(text);
  let hi=-1,cols=null;
  for(let i=0;i<Math.min(rows.length,12);i++){const c=detectCols(rows[i]);if(c.ok){hi=i;cols=c;break;}}
  if(!cols){openSheet('<h3>Fichier non reconnu</h3><p class="lead">Je n\'ai pas trouvé les colonnes date, libellé et montant dans ce fichier. Exporte le relevé de ta banque au format CSV (avec une ligne d\'en-têtes) et réessaie.</p><div class="sheet-actions"><button class="btn" data-act="closeSheet">Fermer</button></div>',{key:'csv'});return;}
  const cy=currentCycle(),start=cy?cy.start:'0000-00-00';
  const existing=S.operations.filter(o=>o.type==='depense');
  const out=[];let credits=0,old=0,dup=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];
    const date=parseDateAny(r[cols.date]);
    if(!date)continue;
    let amt;
    if(cols.amount>=0)amt=parseNum(r[cols.amount]);
    else{const d=parseNum(r[cols.debit]),c=parseNum(r[cols.credit]);amt=isFinite(d)&&d!==0?-Math.abs(d):(isFinite(c)?Math.abs(c):NaN);}
    if(!isFinite(amt)||amt===0)continue;
    if(amt>0){credits++;continue;}
    if(date<start){old++;continue;}
    const label=String(r[cols.label]||'').replace(/\s+/g,' ').trim().slice(0,120)||'Dépense';
    const a=Math.abs(amt);
    const isDup=existing.some(o=>o.date===date&&Math.abs(o.amount-a)<0.005);
    if(isDup)dup++;
    out.push({date,label,amount:a,catId:isDup?'_skip':suggestCat(label,rules),dup:isDup});
  }
  csvRows=out;
  if(!out.length){openSheet('<h3>Rien à importer</h3><p class="lead">Aucune dépense du cycle en cours dans ce fichier'+(old?' ('+old+' plus anciennes ignorées)':'')+'.</p><div class="sheet-actions"><button class="btn" data-act="closeSheet">Fermer</button></div>',{key:'csv'});return;}
  UI.csvMeta={credits,old,dup};
  drawCsv(UI.csvMeta);
}
function drawCsv(meta){
  const opts=sel=>'<option value=""'+(sel===''?' selected':'')+'>À classer</option>'+S.categories.map(k=>'<option value="'+esc(k.id)+'"'+(sel===k.id?' selected':'')+'>'+esc(k.icon+' '+k.name)+'</option>').join('')+'<option value="_skip"'+(sel==='_skip'?' selected':'')+'>Ignorer</option>';
  openSheet('<h3>Importer le relevé</h3><p class="lead">'+csvRows.length+' dépense'+(csvRows.length>1?'s':'')+' du cycle en cours. Choisis une catégorie pour chacune : l\'appli s\'en souviendra pour la prochaine fois.</p>'+
    '<div class="list" style="margin-top:12px">'+csvRows.map((r,i)=>'<div class="row nobadge" style="flex-wrap:wrap;align-items:center"><div class="grow"><div class="t">'+esc(r.label)+'</div><div class="s">'+dShort(r.date)+(r.dup?' · déjà saisie ?':'')+'</div></div><div class="amt">−'+eur(r.amount)+'</div><select data-act="csvCat" data-i="'+i+'" aria-label="Catégorie" style="width:100%;height:42px;margin-top:6px">'+opts(r.catId)+'</select></div>').join('')+'</div>'+
    '<p class="help">'+(meta.credits?meta.credits+' entrée'+(meta.credits>1?'s':'')+' d\'argent ignorée'+(meta.credits>1?'s':'')+'. ':'')+(meta.old?meta.old+' opération'+(meta.old>1?'s':'')+' avant ce cycle ignorée'+(meta.old>1?'s':'')+'. ':'')+(meta.dup?meta.dup+' ligne'+(meta.dup>1?'s':'')+' ressemblent à des dépenses déjà saisies (marquées « Ignorer »).':'')+'</p>'+
    '<div class="sheet-actions"><button class="btn ghost" data-act="closeSheet">Annuler</button><button class="btn" id="csv_go">Importer</button></div>',{key:'csv',tall:true});
  $('#csv_go').onclick=importCsvRows;
  refreshCsvCount();
}
function refreshCsvCount(){
  const n=csvRows.filter(r=>r.catId&&r.catId!=='_skip').length,b=$('#csv_go');
  if(b){b.textContent=n?'Importer '+n+' dépense'+(n>1?'s':''):'Choisis des catégories';b.disabled=!n;b.style.opacity=n?'1':'.5';}
}
async function importCsvRows(){
  const sel=csvRows.filter(r=>r.catId&&r.catId!=='_skip');
  if(!sel.length)return;
  let rules={};try{rules=JSON.parse(S.settings.catRules||'{}');}catch(e){rules={};}
  sel.forEach(r=>{const k=labelKey(r.label);if(k)rules[k]=r.catId;});
  const keys=Object.keys(rules);if(keys.length>300)keys.slice(0,keys.length-300).forEach(k=>delete rules[k]);
  const r=await act('importOps',{ops:sel.map(x=>({date:x.date,catId:x.catId,amount:x.amount,label:x.label}))},sel.length+' dépense'+(sel.length>1?'s':'')+' importée'+(sel.length>1?'s':''),true);
  if(r){await call('saveSettings',{values:{catRules:JSON.stringify(rules)}}).then(x=>{S=x.state;});closeSheet();render();}
}

],quiz:{q:`Un placement passe de 1 000 € à 1 210 € en 2 ans. Sa performance annualisée est d'environ…`,o:['10 %','21 %','5 %'],a:0,why:'1,10 × 1,10 = 1,21 : +10 % par an pendant 2 ans donnent +21 % au total.'}},

{id:'l10',title:'Investir avec peu d\'argent',min:4,blocks:[
 ['p',`Pas besoin d'être riche pour investir : le plus important, c'est la <b>régularité</b>. Mais avec de petits montants, les frais fixes comptent davantage.`],
 ['ul',[
  `<b>Les frais de courtage minimums</b> : certains courtiers prélèvent un minimum par ordre. Une commission fixe de 1 ou 2 € pèse bien plus sur un achat de 50 € que sur un achat de 1 000 €.`,
  `<b>La solution</b> : regrouper tes achats (par exemple tous les 2 ou 3 cycles) ou choisir un courtier qui propose des frais réduits sur les petits ordres.`,
  `<b>Le prix d'une part</b> : un ETF vaut souvent quelques dizaines d'euros la part. On achète des parts entières ; le reste de ton versement attend sur le compte et sera investi au prochain achat.`
 ]],
 ['h','Un ordre des priorités simple'],
 ['steps',[
  ['Le matelas d\'abord',`3 mois de dépenses sur livrets avant de toucher à la bourse.`],
  ['Un montant fixe chaque cycle',`Même 30 €. L'habitude vaut plus que le montant.`],
  ['Augmenter à chaque hausse de revenu',`Chaque fois que tes revenus montent, relève ton taux d'épargne d'un point : tu ne sens presque rien.`]
 ]],
 ['call','tip','Dans l\'appli',`Les jauges de l'onglet Budget te permettent de régler ton taux d'épargne en glissant. La répartition entre livrets et bourse se règle dans Bourse › Stratégie.`]
],quiz:{q:`Pourquoi regrouper ses achats quand on investit de petits montants ?`,o:[`Pour limiter le poids des frais fixes de courtage`,`Pour payer moins d'impôt`,`Parce que c'est obligatoire`],a:0,why:'Une commission fixe pèse proportionnellement plus sur un petit ordre : moins d\'ordres, plus gros, coûtent moins cher.'}},

{id:'l11',title:'Les pièges du comportement',min:5,blocks:[
 ['p',`Le plus gros ennemi d'un investisseur est souvent… lui-même. Les mêmes réflexes reviennent chez tout le monde.`],
 ['ul',[
  `<b>L'aversion à la perte</b> : une perte fait plus mal qu'un gain équivalent ne fait plaisir. Résultat : on vend en panique après une baisse.`,
  `<b>Le FOMO</b> (peur de rater le coup) : on achète parce que tout le monde en parle, souvent après une grosse hausse.`,
  `<b>La surconfiance</b> : croire qu'on sait deviner les bons moments, alors que les professionnels n'y arrivent pas non plus de façon régulière.`,
  `<b>L'effet de troupeau</b> : copier ce que font les autres, sans comprendre pourquoi.`,
  `<b>Le biais de récence</b> : croire que ce qui vient de se passer va continuer (« ça monte, ça va monter »).`,
  `<b>L'effet de disposition</b> : vendre trop vite ce qui gagne et garder trop longtemps ce qui perd.`
 ]],
 ['h','Les parades'],
 ['steps',[
  ['Écrire sa stratégie',`Onglet Bourse › Stratégie : tu décides à froid.`],
  ['Automatiser les versements',`Un virement programmé, comme une dépense fixe, supprime la tentation de « choisir le bon moment ».`],
  ['Regarder moins souvent',`Une fois par cycle suffit. Si tu regardes tous les jours, tu vois surtout du bruit.`],
  ['La règle des 24 heures',`Pour toute décision hors plan, attends 24 heures avant d'agir.`],
  ['Se méfier des réseaux sociaux',`Un conseil gratuit, enthousiaste et pressant est rarement désintéressé.`]
 ]],
 ['call','warn','Test rapide',`Si ton PEA perdait 20 % demain, ta stratégie écrite te dirait quoi faire ? Si la réponse est « je ne sais pas », écris-la maintenant.`]
],quiz:{q:`Quelle habitude te protège le mieux des erreurs dictées par l'émotion ?`,o:[`Automatiser des versements réguliers selon un plan écrit`,`Suivre les cours toute la journée`,`Acheter ce dont tout le monde parle`],a:0,why:'Un plan écrit et des versements automatiques retirent l\'émotion de la décision.'}},

{id:'l12',title:'Obligations et taux d\'intérêt',min:5,blocks:[
 ['p',`Une <b>obligation</b> est un prêt : tu prêtes à un État ou à une entreprise, qui te verse un intérêt (le <b>coupon</b>) et te rembourse à l'échéance.`],
 ['h','Taux et prix vont en sens inverse'],
 ['p',`Quand les taux montent, les obligations déjà émises (qui paient un coupon plus faible) deviennent moins attractives : <b>leur prix baisse</b>. Quand les taux baissent, leur prix monte. Plus l'échéance est lointaine, plus la variation est forte (c'est la <b>duration</b>).`],
 ['ul',[
  `<b>Risque de taux</b> : le prix varie avec les taux.`,
  `<b>Risque de crédit</b> : l'émetteur peut ne pas rembourser. Les États solides et les grandes entreprises sont moins risqués que les émetteurs fragiles, qui paient un coupon plus élevé pour compenser.`,
  `<b>Inflation</b> : un coupon fixe perd de la valeur réelle si les prix montent vite.`
 ]],
 ['call','tip','Fonds en euros ou obligations ?',`Le fonds en euros d'une assurance-vie a un capital garanti par l'assureur. Une obligation ou un ETF obligataire n'a pas cette garantie : sa valeur varie chaque jour.`],
 ['p',`<b>À quoi servent-elles dans un portefeuille ?</b> À amortir les baisses des actions, car elles bougent souvent différemment. Pas toujours : en 2022, actions et obligations ont baissé ensemble. Ce n'est pas un bouclier parfait, seulement un amortisseur.`]
],quiz:{q:`Quand les taux d'intérêt montent, que se passe-t-il en général pour le prix d'une obligation existante ?`,o:['Il baisse','Il monte','Il ne bouge pas'],a:0,why:'Les nouvelles obligations paient plus : les anciennes valent moins pour rester compétitives.'}}

];

/* ---------- graphiques & simulateurs ---------- */
function shortEur(n){return n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M€':(n>=1000?Math.round(n/1000)+' k€':Math.round(n)+' €');}
function lineChart(series,o){
  o=o||{};
  const W=340,H=190,pl=46,pr=10,pt=12,pb=26;
  const n=series[0].pts.length;
  const max=Math.max(1,...series.map(s=>Math.max(...s.pts)));
  const X=i=>pl+(W-pl-pr)*i/Math.max(1,n-1),Y=v=>pt+(H-pt-pb)*(1-v/max);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Graphique')+'">';
  [0,.5,1].forEach(f=>{const yy=Y(max*f);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+shortEur(max*f)+'</text>';});
  series.forEach(se=>{
    const d=se.pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    if(se.fill)s+='<path d="'+d+' L'+X(n-1).toFixed(1)+' '+Y(0).toFixed(1)+' L'+X(0).toFixed(1)+' '+Y(0).toFixed(1)+' Z" fill="'+se.color+'" opacity=".16"/>';
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"'+(se.dash?' stroke-dasharray="5 4"':'')+'/>';
  });
  const last=n-1;
  [0,Math.round(last/2),last].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':(i===last?'end':'middle'))+'">'+(o.labels?(o.labels[i]||''):(i===0?'0':i+' ans'))+'</text>';});
  return s+'</svg>';
}
function projection(init,monthly,years,ratePct){
  const rm=Math.pow(1+ratePct/100,1/12)-1;
  let b=init,c=init;const bal=[b],con=[c];
  for(let y=1;y<=years;y++){for(let m=0;m<12;m++){b=b*(1+rm)+monthly;c+=monthly;}bal.push(b);con.push(c);}
  return {bal,con};
}
function simHtml(kind){
  if(kind==='compound'){
    const c=currentCycle(),st=c?stats(c):null;
    const m=st&&st.savings>0?Math.round(st.savings/10)*10:100;
    return '<div class="simbox" data-sim="compound"><div class="two"><div class="field" style="margin:0"><label for="sc_init">Départ (€)</label><input id="sc_init" inputmode="decimal" value="500"></div><div class="field" style="margin:0"><label for="sc_m">Chaque mois (€)</label><input id="sc_m" inputmode="decimal" value="'+m+'"></div></div>'+
      '<div class="field" style="margin:10px 0 0"><label for="sc_y">Durée : <b id="sc_yv">20</b> ans</label><input type="range" id="sc_y" min="1" max="40" value="20"></div>'+
      '<div class="field" style="margin:0"><label for="sc_r">Rendement annuel supposé : <b id="sc_rv">5</b> %</label><input type="range" id="sc_r" min="0" max="12" step="0.5" value="5"></div><div id="sc_out"></div></div>';
  }
  if(kind==='fees'){
    return '<div class="simbox" data-sim="fees"><div class="two"><div class="field" style="margin:0"><label for="sf_m">Chaque mois (€)</label><input id="sf_m" inputmode="decimal" value="150"></div><div class="field" style="margin:0"><label for="sf_g">Rendement brut (%)</label><input id="sf_g" inputmode="decimal" value="6"></div></div>'+
      '<div class="field" style="margin:10px 0 0"><label for="sf_y">Durée : <b id="sf_yv">25</b> ans</label><input type="range" id="sf_y" min="5" max="40" value="25"></div>'+
      '<div class="two"><div class="field" style="margin:0"><label for="sf_a">Frais A (%/an)</label><input id="sf_a" inputmode="decimal" value="0,2"></div><div class="field" style="margin:0"><label for="sf_b">Frais B (%/an)</label><input id="sf_b" inputmode="decimal" value="1,8"></div></div><div id="sf_out"></div></div>';
  }
  if(kind==='cagr'){
    return '<div class="simbox" data-sim="cagr"><div class="two"><div class="field" style="margin:0"><label for="sg_a">Capital de départ (€)</label><input id="sg_a" inputmode="decimal" value="1000"></div><div class="field" style="margin:0"><label for="sg_b">Capital final (€)</label><input id="sg_b" inputmode="decimal" value="1400"></div></div><div class="field" style="margin:10px 0 0"><label for="sg_y">Durée : <b id="sg_yv">8</b> ans</label><input type="range" id="sg_y" min="1" max="40" value="8"></div><div id="sg_out"></div></div>';
  }
  return '<div class="simbox" data-sim="drawdown"><div class="field" style="margin:0"><label for="sd_x">Baisse subie : <b id="sd_xv">30</b> %</label><input type="range" id="sd_x" min="5" max="80" value="30"></div><div id="sd_out"></div></div>';
}
function bindSims(root){
  const box=sel=>root.querySelector(sel);
  const c=box('[data-sim=compound]');
  if(c){
    const run=()=>{
      const init=Math.max(0,parseNum(val('sc_init'))||0),m=Math.max(0,parseNum(val('sc_m'))||0),y=+val('sc_y'),r=+val('sc_r');
      $('#sc_yv').textContent=y;$('#sc_rv').textContent=String(r).replace('.',',');
      const p=projection(init,m,y,r),fin=p.bal[y],ver=p.con[y];
      $('#sc_out').innerHTML=lineChart([{color:'var(--invest)',pts:p.bal,fill:true},{color:'var(--muted)',pts:p.con,dash:true}],{label:'Capital et sommes versées'})+
        '<div class="res"><div><span class="muted small">Capital final</span><b>'+eurR(fin)+'</b></div><div><span class="muted small">Versé</span><b>'+eurR(ver)+'</b></div><div><span class="muted small">Gains</span><b style="color:var(--pos)">'+eurR(fin-ver)+'</b></div></div>'+
        '<p class="small muted" style="margin:8px 0 0">Courbe pleine : ton capital. Pointillés : ce que tu as versé. Scénario régulier, avant impôts.</p>';
    };
    root.querySelectorAll('[data-sim=compound] input').forEach(i=>i.addEventListener('input',run));run();
  }
  const f=box('[data-sim=fees]');
  if(f){
    const run=()=>{
      const m=Math.max(0,parseNum(val('sf_m'))||0),g=parseNum(val('sf_g')),a=parseNum(val('sf_a'))||0,b=parseNum(val('sf_b'))||0,y=+val('sf_y');
      $('#sf_yv').textContent=y;
      if(!isFinite(g)){$('#sf_out').innerHTML='';return;}
      const pa=projection(0,m,y,Math.max(-50,g-a)),pb=projection(0,m,y,Math.max(-50,g-b));
      const fa=pa.bal[y],fb=pb.bal[y];
      $('#sf_out').innerHTML=lineChart([{color:'var(--pos)',pts:pa.bal},{color:'var(--neg)',pts:pb.bal}],{label:'Capital selon les frais'})+
        '<div class="res"><div><span class="muted small">Frais A</span><b style="color:var(--pos)">'+eurR(fa)+'</b></div><div><span class="muted small">Frais B</span><b style="color:var(--neg)">'+eurR(fb)+'</b></div><div><span class="muted small">Écart</span><b>'+eurR(fa-fb)+'</b></div></div>'+
        '<p class="small muted" style="margin:8px 0 0">Simplification : les frais sont retranchés du rendement brut chaque année.</p>';
    };
    root.querySelectorAll('[data-sim=fees] input').forEach(i=>i.addEventListener('input',run));run();
  }
  const g=box('[data-sim=cagr]');
  if(g){
    const run=()=>{
      const a=parseNum(val('sg_a')),b=parseNum(val('sg_b')),y=+val('sg_y');$('#sg_yv').textContent=y;
      if(!(a>0)||!isFinite(b)||b<0){$('#sg_out').innerHTML='';return;}
      const cum=(b/a-1)*100,ann=(Math.pow(b/a,1/y)-1)*100,infl=2,real=((1+ann/100)/(1+infl/100)-1)*100;
      $('#sg_out').innerHTML='<div class="res"><div><span class="muted small">Performance cumulée</span><b>'+(cum>=0?'+':'')+fmtPct(cum)+'</b></div><div><span class="muted small">Par an (annualisée)</span><b style="color:'+(ann>=0?'var(--pos)':'var(--neg)')+'">'+(ann>=0?'+':'')+fmtPct(ann)+'</b></div><div><span class="muted small">Réelle (inflation 2 %)</span><b>'+(real>=0?'+':'')+fmtPct(real)+'</b></div></div><p class="small muted" style="margin:8px 0 0">Simple division : '+fmtPct(cum/y)+' par an. La vraie moyenne annuelle est plus basse à cause de l\'effet composé.</p>';
    };
    g.querySelectorAll('input').forEach(i=>i.addEventListener('input',run));run();
  }
  const d=box('[data-sim=drawdown]');
  if(d){
    const run=()=>{
      const x=+val('sd_x');$('#sd_xv').textContent=x;
      const need=(1/(1-x/100)-1)*100;
      $('#sd_out').innerHTML='<div class="res"><div><span class="muted small">Après −'+x+' %</span><b style="color:var(--neg)">'+eurR(100*(1-x/100))+'</b><span class="muted small">pour 100 € investis</span></div><div><span class="muted small">Hausse nécessaire</span><b style="color:var(--pos)">+'+Math.round(need)+' %</b><span class="muted small">pour revenir à 100 €</span></div></div>';
    };
    d.querySelectorAll('input').forEach(i=>i.addEventListener('input',run));run();
  }
}

/* ---------- rendu des leçons ---------- */
function dynHtml(kind){
  if(kind!=='cushion')return '';
  const q=cushion();
  if(!(q.monthly>0))return '<div class="callout"><b>Ton matelas de sécurité</b>Démarre un cycle et enregistre quelques dépenses : je calculerai ton objectif (3 à 6 mois de dépenses) automatiquement.</div>';
  const pct=q.safe/q.min;
  return '<div class="callout tip"><b>Ton matelas de sécurité</b>Tes dépenses courantes tournent autour de '+eurR(q.monthly)+' par cycle ('+(q.basis==='moyenne'?'moyenne de tes derniers cycles':'selon tes budgets')+'). Objectif : '+eurR(q.min)+' à '+eurR(q.max)+'. Tu as '+eurR(q.safe)+' sur tes livrets de sécurité.'+
    '<div style="margin-top:10px">'+bar(pct,'var(--pos)',{thick:true})+'</div><div class="small muted" style="margin-top:6px">'+(q.safe>=q.min?'Objectif minimum atteint : tu peux commencer à investir sereinement.':'Il manque '+eurR(q.min-q.safe)+' pour atteindre 3 mois de dépenses.')+'</div></div>';
}
function blocksHtml(blocks){
  return blocks.map(b=>{
    switch(b[0]){
      case 'p':return '<p>'+b[1]+'</p>';
      case 'h':return '<h4>'+b[1]+'</h4>';
      case 'ul':return '<ul>'+b[1].map(x=>'<li>'+x+'</li>').join('')+'</ul>';

function simulateYears(init,monthly,years,ratePct,crash,infl){
  const rm=Math.pow(1+ratePct/100,1/12)-1;
  let b=init,c=init;const bal=[b],con=[c];
  for(let y=1;y<=years;y++){
    for(let m=0;m<12;m++){b=b*(1+rm)+monthly;c+=monthly;}
    if(crash&&crash.year===y)b*=(1-crash.pct/100);
    const f=infl?Math.pow(1+infl/100,y):1;
    bal.push(b/f);con.push(c/f);
  }
  return {bal,con};
}
function plannedInvestMonthly(){
  const c=currentCycle();
  if(c&&c.savings>0){
    const al=allocate(c.savings,{cushionFirst:false});
    const inv=sum(al.lines.filter(l=>{const lv=livretById(l.livretId);return lv&&!isSafeKind(lv.kind);}),l=>l.amount);
    if(inv>0)return Math.round(inv);
    return Math.max(10,Math.round(c.savings/10)*10);
  }
  return 100;
}

function bindToolSim(root){
  const box=root.querySelector('[data-tool=sim]');if(!box)return;
  const run=()=>{
    const init=Math.max(0,parseNum(val('ts_init'))||0),m=Math.max(0,parseNum(val('ts_m'))||0),y=+val('ts_y');
    const r=[parseNum(val('ts_r1')),parseNum(val('ts_r2')),parseNum(val('ts_r3'))].map(x=>isFinite(x)?clamp(x,-20,30):0);
    $('#ts_yv').textContent=y;
    const crashOn=$('#ts_crash').checked,infl=$('#ts_infl').checked?2:0;
    $('#ts_crashbox').hidden=!crashOn;
    const cy=$('#ts_cy');cy.max=y;if(+cy.value>y)cy.value=y;
    $('#ts_cxv').textContent=val('ts_cx');$('#ts_cyv').textContent=cy.value;
    const crash=crashOn?{year:+cy.value,pct:+val('ts_cx')}:null;
    const sims=r.map(x=>simulateYears(init,m,y,x,crash,infl));
    const cols=['var(--warn)','var(--tint)','var(--pos)'];
    const series=sims.map((s,i)=>({color:cols[i],pts:s.bal})).concat([{color:'var(--muted)',pts:sims[0].con,dash:true}]);
    const con=sims[0].con[y];
    $('#ts_out').innerHTML=lineChart(series,{label:'Trois scénarios de capital'})+
      '<div class="res">'+['Prudent','Médian','Optimiste'].map((nm,i)=>{const f=sims[i].bal[y];return '<div><span class="muted small">'+nm+' ('+fnum(r[i])+' %)</span><b style="color:'+cols[i]+'">'+eurR(f)+'</b><span class="small muted">gain '+(f-con>=0?'+':'−')+eurR(Math.abs(f-con))+'</span></div>';}).join('')+'</div>'+
      '<p class="small muted" style="margin:8px 0 0">Versé au total : '+eurR(con)+(infl?' (en euros d\'aujourd\'hui)':'')+'. Pointillés : sommes versées.'+(crash?' Le krach de '+crash.pct+' % arrive à la fin de l\'année '+crash.year+' : regarde comme la courbe se redresse avec le temps.':'')+'</p>';
  };
  box.querySelectorAll('input').forEach(i=>{i.addEventListener('input',run);i.addEventListener('change',run);});
  run();
}

   VUE D'ENSEMBLE : tout l'argent en un coup d'œil

function budgetScore(st){
  const over=sum(st.rows,r=>Math.max(0,r.spent-r.budget));
  const kept=st.envBudget>0?clamp(1-over/st.envBudget,0,1):1;
  const judged=st.savings>0&&(st.closed||st.frac>=0.5);
  const sav=st.savings>0?(judged?clamp(st.savedNet/st.savings,0,1):1):1;
  const cu=cushion();
  const mat=cu.min>0?clamp(cu.safe/cu.min,0,1):1;
  const score=Math.round(100*(0.4*kept+0.3*sav+0.3*mat));
  return {score,parts:[['Budget tenu',kept,'dépassements évités'],['Épargne du cycle',sav,judged?'objectif atteint':'pas encore jugée'],['Matelas de sécurité',mat,'3 mois de dépenses']]};
}
const scoreColor=n=>n>=75?'#34C759':(n>=50?'#FF9500':'#FF3B30');

function gaugeSvg(months,max){
  const cx=120,cy=108,r=88,w=16;
  const deg=m=>-90+clamp(m,0,max)/max*180;
  const zone=(a,b,col)=>'<path d="'+arcPath(cx,cy,r,deg(a),deg(b))+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" opacity=".28"/>';
  let s='<svg viewBox="-24 -26 288 166" role="img" aria-label="Matelas de sécurité : '+(Math.round(months*10)/10)+' mois de dépenses couverts" style="width:100%;max-width:300px;display:block;margin:0 auto">';
  s+=zone(0,1,'#FF3B30')+zone(1,3,'#FF9500')+zone(3,max,'#34C759');
  const col=months>=3?'#34C759':(months>=1?'#FF9500':'#FF3B30');
  if(months>0.02)s+='<path d="'+arcPath(cx,cy,r,deg(0),deg(months))+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/>';
  const e=polar(cx,cy,r,deg(months));
  s+='<circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="7" fill="var(--surface)" stroke="'+col+'" stroke-width="3"/>';
  s+='<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" style="font:700 30px var(--font);fill:var(--ink)">'+(Math.round(months*10)/10).toString().replace('.',',')+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" style="font:500 12px var(--font);fill:var(--muted)">mois couverts</text>';
  [[0,'0'],[3,'3'],[max,max+' mois']].forEach(t=>{const p=polar(cx,cy,r+20,deg(t[0]));s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="middle" style="font:500 10px var(--font);fill:var(--muted)">'+t[1]+'</text>';});
  return s+'</svg>';
}

function overviewItems(st){
  const items=[];
  if(st.P>0)items.push({name:'Prélèvements',v:st.P,color:C.gray,spent:st.P});
  st.rows.filter(r=>r.cat.id&&r.budget>0).forEach(r=>items.push({name:r.cat.name,v:r.budget,color:r.cat.color,spent:Math.min(r.spent,r.budget)}));
  if(st.savings>0)items.push({name:'Épargne',v:st.savings,color:'#34C759',spent:Math.min(Math.max(0,st.savedNet),st.savings)});
  if(st.unallocated>1)items.push({name:'Non affecté',v:st.unallocated,color:'#C7C7CC',spent:0});
  return items;
}
function sankeySvg(items){
  const total=sum(items,i=>i.v);
  if(!(total>0))return '';
  const W=340,H=216,x0=4,nw=10,x1=226,gap=6,top=6;
  const usable=H-top*2-gap*(items.length-1),sl=(H-top*2)/total,sr=usable/total;
  let yL=top,yR=top;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Flux de tes revenus vers prélèvements, enveloppes et épargne">';
  s+='<rect x="'+x0+'" y="'+top+'" width="'+nw+'" height="'+(H-top*2)+'" rx="4" fill="var(--ink)" opacity=".85"/>';
  items.forEach(it=>{
    const hl=it.v*sl,hr=it.v*sr,xa=x0+nw,xb=x1,mx=(xa+xb)/2;
    s+='<path d="M'+xa+' '+yL.toFixed(1)+' C'+mx+' '+yL.toFixed(1)+' '+mx+' '+yR.toFixed(1)+' '+xb+' '+yR.toFixed(1)+' L'+xb+' '+(yR+hr).toFixed(1)+' C'+mx+' '+(yR+hr).toFixed(1)+' '+mx+' '+(yL+hl).toFixed(1)+' '+xa+' '+(yL+hl).toFixed(1)+' Z" fill="'+it.color+'" opacity=".34"/>';
    s+='<rect x="'+xb+'" y="'+yR.toFixed(1)+'" width="'+nw+'" height="'+Math.max(1,hr).toFixed(1)+'" rx="3" fill="'+it.color+'" opacity=".28"/>';
    const sh=hr*clamp(it.spent/it.v,0,1);
    if(sh>0.5)s+='<rect x="'+xb+'" y="'+yR.toFixed(1)+'" width="'+nw+'" height="'+sh.toFixed(1)+'" rx="3" fill="'+it.color+'"/>';
    if(hr>=13){
      const nm=it.name.length>12?it.name.slice(0,11)+'…':it.name;
      s+='<text x="'+(xb+nw+7)+'" y="'+(yR+hr/2-1).toFixed(1)+'" style="font:600 11px var(--font);fill:var(--ink)">'+esc(nm)+'</text><text x="'+(xb+nw+7)+'" y="'+(yR+hr/2+11).toFixed(1)+'" style="font:500 10px var(--font);fill:var(--muted)">'+eurR(it.v)+'</text>';
    }
    yL+=hl;yR+=hr+gap;
  });
  return s+'</svg>';
}

function stackedSvg(data){
  const W=340,H=184,pl=8,pr=8,pt=20,pb=26,n=data.length;
  const mx=Math.max(1,...data.map(d=>sum(d.segs,s=>s.v)));
  const sc=(H-pt-pb)/mx,step=(W-pl-pr)/n,bw=Math.min(38,step*.62);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Dépenses par cycle et par catégorie"><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  data.forEach((d,i)=>{
    const x=pl+step*i+(step-bw)/2;let y=H-pb;
    d.segs.forEach(sg=>{
      const h=sg.v*sc;if(h<=0)return;
      y-=h;s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" fill="'+sg.color+'"/>';
    });
    const tot=sum(d.segs,sg=>sg.v);
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+eurR(tot)+'</text>';
    if(n<=6||i%2===(n-1)%2)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+d.label+'</text>';
  });
  return s+'</svg>';
}
function rateSvg(data,target){
  const W=340,H=150,pl=8,pr=8,pt=20,pb=26,n=data.length;
  const mx=Math.max(20,target*1.3,...data.map(d=>d.v))+4;
  const sc=(H-pt-pb)/mx,step=(W-pl-pr)/n,bw=Math.min(34,step*.6);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Taux d\'épargne par cycle"><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  const ty=H-pb-target*sc;
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ty.toFixed(1)+'" y2="'+ty.toFixed(1)+'" stroke="var(--tint)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="'+(W-pr)+'" y="'+(ty-4).toFixed(1)+'" text-anchor="end" style="fill:var(--tint)">objectif '+Math.round(target)+' %</text>';
  data.forEach((d,i)=>{
    const x=pl+step*i+(step-bw)/2,h=Math.max(0,d.v)*sc;
    s+='<rect x="'+x.toFixed(1)+'" y="'+(H-pb-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="6" fill="'+(d.v>=target?'#34C759':'#FF9500')+'"/>';
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-pb-h-5).toFixed(1)+'" text-anchor="middle">'+Math.round(d.v)+' %</text>';
    if(n<=6||i%2===(n-1)%2)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+d.label+'</text>';
  });
  return s+'</svg>';
}
function heatmapHtml(c,st){
  const total=Math.max(st.total,st.since+1);
  const byDay={};st.ops.filter(o=>o.type==='depense').forEach(o=>{byDay[o.date]=(byDay[o.date]||0)+o.amount;});
  const vals=Object.keys(byDay).map(k=>byDay[k]);
  const max=Math.max(1,...vals);
  const dow=(new Date(D.p(c.start)).getUTCDay()+6)%7;
  let cells='';
  for(let i=0;i<dow;i++)cells+='<i style="visibility:hidden"></i>';
  let busiest=null;
  for(let d=0;d<total;d++){
    const date=D.add(c.start,d),v=byDay[date]||0,fut=date>S.today;
    if(v>0&&(!busiest||v>busiest.v))busiest={date,v};
    cells+='<i class="'+(date===S.today?'today':'')+'" title="'+dShort(date)+' : '+eur(v)+'" style="background:'+(v>0?'rgba(0,122,255,'+(0.18+0.72*v/max).toFixed(2)+')':'var(--track)')+(fut?';opacity:.35':'')+'">'+(+date.slice(8))+'</i>';
  }
  return '<div class="heat-h">'+['L','M','M','J','V','S','D'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="heat">'+cells+'</div>'+
    '<div class="small muted" style="margin-top:8px">'+(busiest?'Jour le plus dépensier : '+dShort(busiest.date)+' ('+eur(busiest.v)+'). Plus la case est foncée, plus tu as dépensé.':'Aucune dépense ce cycle pour l\'instant.')+'</div>';
}
function friseSvg(c,st){
  const W=340,H=92,x0=16,x1=324,y=54,total=st.total;
  const pos=d=>x0+(x1-x0)*clamp(d/total,0,1);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Frise du cycle">';
  s+='<line x1="'+x0+'" x2="'+x1+'" y1="'+y+'" y2="'+y+'" stroke="var(--track)" stroke-width="10" stroke-linecap="round"/>';
  const cur=Math.min(st.since+0.5,total);
  s+='<line x1="'+x0+'" x2="'+pos(cur).toFixed(1)+'" y1="'+y+'" y2="'+y+'" stroke="var(--tint)" stroke-width="10" stroke-linecap="round"/>';
  (st.fixed||[]).forEach(f=>{
    if(!f.day)return;
    for(let d=0;d<total;d++){
      const date=D.add(c.start,d);
      if(+date.slice(8)===+f.day){const x=pos(d+0.5);s+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+(y-10)+'" y2="'+(y-4)+'" stroke="var(--muted)" stroke-width="1.5"/><text x="'+x.toFixed(1)+'" y="'+(y-14)+'" text-anchor="middle" style="font-size:13px">'+esc(f.icon)+'</text>';break;}
    }
  });
  if(!st.closed){const x=pos(cur);s+='<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="9" fill="var(--surface)" stroke="var(--tint)" stroke-width="4"/>';}
  s+='<text x="'+x0+'" y="'+(y+26)+'" style="font-size:11px">'+dShort(c.start)+'</text><text x="'+x1+'" y="'+(y+26)+'" text-anchor="end" style="font-size:11px">paie ≈ '+dShort(D.add(c.start,total))+'</text>';
  return s+'</svg>';
}


/* ---------- ce que l'appli a compris de tes habitudes (calcul local, gratuit) ---------- */
function habitsProfile(){
  const items=[];
  const cs=cyclesSorted(),ob=opsByCycle();
  const deps=S.operations.filter(o=>o.type==='depense'&&o.amount>0);
  if(deps.length<8)return {items:[],need:8-deps.length};
  const names=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const byDow=[0,0,0,0,0,0,0];
  deps.forEach(o=>{byDow[new Date(D.p(o.date)).getUTCDay()]+=o.amount;});
  const tot=sum(byDow),best=byDow.indexOf(Math.max.apply(null,byDow));
  if(tot>0)items.push({icon:'📅',t:'Tu dépenses surtout le '+names[best]+' ('+Math.round(byDow[best]/tot*100)+' % de tes dépenses).'});
  const closed=cs.filter(x=>cycleEnd(x)&&(ob[x.id]||[]).length>0);
  if(closed.length>=1){
    let first=0,all=0;
    closed.forEach(x=>{
      const len=D.diff(x.start,cycleEnd(x));
      (ob[x.id]||[]).filter(o=>o.type==='depense').forEach(o=>{all+=o.amount;if(D.diff(x.start,o.date)<len/2)first+=o.amount;});
    });
    if(all>0){
      const p=Math.round(first/all*100);
      items.push({icon:'⏱️',t:p>=58?'Tu dépenses '+p+' % de ton budget dans la première moitié du cycle : garde de la marge pour la fin.':(p<=42?'Tu dépenses surtout en fin de cycle ('+(100-p)+' % dans la seconde moitié).':'Tes dépenses sont bien réparties sur l\'ensemble du cycle.')});
    }
  }
  const overCount={};
  closed.forEach(x=>stats(x).rows.forEach(r=>{if(r.cat.id&&r.status==='over')overCount[r.cat.id]=(overCount[r.cat.id]||0)+1;}));
  const worst=Object.keys(overCount).sort((a,b)=>overCount[b]-overCount[a])[0];
  if(worst&&closed.length>=2){const k=catById(worst);if(k)items.push({icon:'⚠️',t:k.name+' dépasse son budget dans '+overCount[worst]+' cycle'+(overCount[worst]>1?'s':'')+' sur '+closed.length+'. Pense à relever cette enveloppe ou à la surveiller de près.'});}
  const perCycle=closed.length?sum(closed,x=>(ob[x.id]||[]).filter(o=>o.type==='depense').length)/closed.length:null;
  items.push({icon:'🧾',t:'Ton achat moyen est de '+eurR(sum(deps,o=>o.amount)/deps.length)+(perCycle?' et tu fais environ '+Math.round(perCycle)+' achats par cycle.':'.')});
  const combos=quickCombos();
  if(combos.length){const c0=combos[0],k=catById(c0.catId);items.push({icon:k?k.icon:'🔁',t:'Ton habitude n°1 : « '+c0.label+' » à '+eurR(c0.amount)+' ('+c0.n+' fois).'});}
  const rates=closed.map(x=>{const s=stats(x);return s.income>0?(s.savedNet+s.bonusSaved)/s.income*100:0;});
  if(rates.length){
    const avg=sum(rates)/rates.length,tgt=sum(closed,x=>x.rate||0)/closed.length;
    items.push({icon:'🌱',t:'Tu mets de côté en moyenne '+Math.round(avg)+' % de tes revenus'+(tgt?' (objectif '+Math.round(tgt)+' %)':'')+(avg>=tgt-1?' : bravo, tu tiens ton objectif.':'.')});
  }
  if(closed.length>=2){
    const last=stats(closed[closed.length-1]).envSpent,prev=sum(closed.slice(0,-1),x=>stats(x).envSpent)/(closed.length-1);
    if(prev>0){const dv=(last-prev)/prev*100;if(Math.abs(dv)>=8)items.push({icon:dv>0?'📈':'📉',t:'Ton dernier cycle terminé : '+(dv>0?'+':'−')+Math.round(Math.abs(dv))+' % de dépenses par rapport à ta moyenne.'});}
  }
  return {items,need:0};
}

function viewOverview(){
  const c=currentCycle();
  if(!c)return emptyNoCycle();
  const st=stats(c),cs=cyclesSorted(),sc=budgetScore(st),cu=cushion();
  const act=S.livrets.filter(l=>l.active),patri=sum(act,l=>livretValue(l));
  const months=cu.monthly>0?cu.safe/cu.monthly:0;
  const items=overviewItems(st);
  let h='<div class="kpis"><div class="kpi"><span>Disponible</span><b class="num" style="color:'+(st.available<0?'var(--neg)':'inherit')+'">'+eurR(st.available)+'</b></div>'+
    '<div class="kpi"><span>Dépensé ce cycle</span><b class="num">'+eurR(st.envSpent)+'</b></div>'+
    '<div class="kpi"><span>Épargné ce cycle</span><b class="num" style="color:var(--pos)">'+eurR(st.savedNet+st.bonusSaved)+'</b></div>'+
    '<div class="kpi"><span>Patrimoine</span><b class="num">'+eurR(patri)+'</b></div></div>';

  h+='<section class="sec"><div class="sec-h"><h2>Santé financière</h2></div><div class="panel pad"><div style="display:flex;gap:16px;align-items:center"><div class="ring" style="width:100px;height:100px">'+ringSvg(sc.score/100,scoreColor(sc.score),false,100,11)+'<span class="em" style="font:700 28px var(--font);letter-spacing:-.02em">'+sc.score+'</span></div><div style="flex:1;min-width:0">'+
    sc.parts.map(p=>'<div style="margin-bottom:9px"><div class="env-h" style="margin-bottom:4px"><span class="n" style="font-size:13.5px">'+p[0]+'</span><span class="small muted num">'+Math.round(p[1]*100)+' %</span></div>'+bar(p[1],scoreColor(p[1]*100))+'</div>').join('')+'</div></div>'+
    '<p class="help" style="margin-top:4px">Score sur 100 : budget tenu (40 %), épargne du cycle (30 %), matelas de sécurité (30 %).</p></div></section>';

  h+='<section class="sec"><div class="sec-h"><h2>Matelas de sécurité</h2></div><div class="panel pad">'+gaugeSvg(months,6)+
    '<p class="help" style="text-align:center">'+(cu.monthly>0?(months>=3?'Tes livrets de sécurité couvrent '+(Math.round(months*10)/10).toString().replace('.',',')+' mois de dépenses : tu peux investir plus sereinement.':'Objectif : 3 à 6 mois de dépenses ('+eurR(cu.min)+' à '+eurR(cu.max)+'). Il te manque '+eurR(Math.max(0,cu.min-cu.safe))+' pour le minimum.'):'Enregistre quelques dépenses pour calculer ton objectif.')+'</p></div></section>';

  if(items.length)h+='<section class="sec"><div class="sec-h"><h2>Où va ta paie</h2></div><div class="panel pad">'+sankeySvg(items)+
    '<div class="leg">'+items.map(i=>'<div><i style="background:'+i.color+'"></i><span>'+esc(i.name)+'</span><b class="num">'+eurR(i.v)+'</b></div>').join('')+'</div>'+
    '<p class="help">Les ruisseaux partent de tes revenus ('+eurR(st.income)+'). La partie pleine à droite montre ce qui est déjà dépensé ou épargné.</p></div></section>';

  if(act.some(l=>livretValue(l)>0)){
    const it=act.filter(l=>livretValue(l)>0).map(l=>({color:l.color,v:livretValue(l),label:l.name}));
    h+='<section class="sec"><div class="sec-h"><h2>Mon patrimoine</h2></div><div class="panel pad"><div class="donutwrap">'+donutSegments(it,240,26,2.5)+'<div class="c"><span>Total</span><b class="num">'+eurR(patri)+'</b></div></div>'+
      '<div class="leg">'+it.map(i=>'<div><i style="background:'+i.color+'"></i><span>'+esc(i.label)+'</span><b class="num">'+eurR(i.v)+'</b></div>').join('')+'</div></div></section>';
  }

  const last=cs.slice(-6);
  if(last.length>=1){
    const catOrder=S.categories;
    const data=last.map(x=>{
      const sx=stats(x);
      const segs=[{v:sx.P,color:C.gray}].concat(catOrder.map(k=>{const r=sx.rows.find(rr=>rr.cat.id===k.id);return {v:r?r.spent:0,color:k.color};}));
